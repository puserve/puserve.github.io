<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">

    <title>Public Repository | PUSERVE</title>
    <meta name="description" content="Official documents, guidelines, and public resources of PUSERVE.">

    <meta property="og:title" content="Public Repository | PUSERVE">
    <meta property="og:description" content="Official documents, guidelines, and public resources of PUSERVE.">
    <meta property="og:image" content="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    <link rel="stylesheet" href="style.css">

    <style>
        .filter-tabs { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;}
        .filter-btn { padding: 10px 25px; border-radius: 30px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 0.95rem; }
        .filter-btn:hover, .filter-btn.active { background: var(--primary-green); color: white; border-color: var(--primary-green); }

        .repo-list { display: flex; flex-direction: column; gap: 20px; }
        .repo-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 25px 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; transition: 0.4s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .repo-item:hover { transform: translateY(-5px); border-color: var(--puserve-yellow); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

        .repo-left { display: flex; align-items: center; gap: 25px; flex: 1; }
        .repo-icon { width: 50px; height: 50px; background: rgba(10, 54, 34, 0.05); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: var(--primary-green); flex-shrink: 0; }
        body.eco-mode .repo-icon { background: rgba(255,255,255,0.05); color: var(--puserve-yellow); }

        .repo-details { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
        .repo-title { font-size: 1.2rem; color: var(--text-color); font-weight: 700; transition: color 0.3s;}
        .repo-item:hover .repo-title { color: var(--primary-green); }
        body.eco-mode .repo-item:hover .repo-title { color: var(--puserve-yellow); }
        .repo-meta { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; display: flex; gap: 15px; flex-wrap: wrap;}

        .repo-actions { display: flex; gap: 10px; align-items: center; }
        .repo-download { padding: 12px 25px; background: var(--puserve-yellow); color: var(--dark-green); border-radius: 10px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; white-space: nowrap;}
        .repo-download:hover { background: var(--primary-green); color: white; transform: scale(1.05); }

        .repo-search-container { max-width: 600px; margin: 0 auto 30px auto; width: 100%; }
        .repo-search-input { width: 100%; padding: 15px 25px; border-radius: 30px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-size: 1rem; outline: none; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.03); box-sizing: border-box; }
        .repo-search-input:focus { border-color: var(--primary-green); box-shadow: 0 5px 20px rgba(10, 54, 34, 0.1); }
        body.eco-mode .repo-search-input:focus { border-color: var(--puserve-yellow); }

        /* FLIPBOOK MODAL */
        #book-modal .modal-content-box { max-width: 1000px; width: 95%; height: 85vh; padding: 0; background: transparent; border: none; box-shadow: none; display: flex; flex-direction: column; position: relative; }
        .close-book-btn { position: absolute; top: -40px; right: 0; color: white; cursor: pointer; background: #ef4444; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; z-index: 10000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.3s; }
        .close-book-btn:hover { transform: scale(1.1) rotate(90deg); background: white; color: #ef4444; }
        #flipbook-container { width: 100%; height: 100%; }
        .df-container { border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        .book-loading { text-align: center; padding: 60px 20px; color: #fff; font-weight: 700; }
        .book-spinner { width: 42px; height: 42px; margin: 0 auto 16px; border: 4px solid rgba(255,255,255,0.25); border-top-color: var(--puserve-yellow); border-radius: 50%; animation: bookspin 1s linear infinite; }
        @keyframes bookspin { to { transform: rotate(360deg); } }
        .book-loading a { color: var(--puserve-yellow); font-weight: 600; }

        @media (max-width: 768px) {
            .repo-item { flex-direction: column; align-items: flex-start; padding: 20px; }
            .repo-actions { width: 100%; justify-content: space-between; }
            .repo-download { width: 100%; justify-content: center; }
            #book-modal .modal-content-box { height: 75vh; }
        }
    </style>
</head>
<body>

    {% include navbar.html %}

    <header class="page-hero">
        <h1 data-en="Public Repository" data-id="Repositori Publik">Public Repository</h1>
        <p style="font-size: 1.1rem; opacity: 0.9;" data-en="Official documents, guidebooks, and public resources of PUSERVE." data-id="Dokumen resmi, buku panduan, dan sumber daya publik PUSERVE.">Official documents, guidebooks, and public resources of PUSERVE.</p>
    </header>

    <main class="container">

        <div class="repo-search-container">
            <input type="text" id="repoSearchInput" class="repo-search-input" placeholder="Search documents..." data-en="Search documents..." data-id="Cari dokumen...">
        </div>

        <div class="filter-tabs" id="filterContainer">
            <button class="filter-btn active" onclick="filterRepo('all', this)" data-en="All Documents" data-id="Semua Dokumen">All Documents</button>
        </div>

        <div class="repo-list" id="repoList">
            <div class="skeleton-card" style="height: 100px; max-width: 100%; flex-direction: row; align-items: center; padding: 20px;"><div class="skeleton" style="width: 50px; height: 50px; border-radius: 12px; margin-right: 20px;"></div><div style="flex:1;"><div class="skeleton" style="width: 40%; height: 20px; margin-bottom: 10px;"></div><div class="skeleton" style="width: 30%; height: 15px;"></div></div></div>
        </div>
    </main>

    <!-- 3D FLIPBOOK MODAL -->
    <div id="book-modal" class="modal-overlay">
        <div class="modal-content-box">
            <div class="close-book-btn" onclick="closeBookModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <div id="flipbook-container"></div>
        </div>
    </div>

    {% include footer.html %}

    <script>
        let repoData = [];

        const getLang = () => localStorage.getItem('puserve_lang') || 'EN';
        const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const catId = (c) => String(c || '').toLowerCase().replace(/[^a-z0-9]/g, '-');

        const formatDate = (dateStr) => {
            try {
                const d = new Date(String(dateStr).replace(/-/g, '/'));
                if (!isNaN(d)) return d.toLocaleDateString(getLang() === 'EN' ? 'en-US' : 'id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch (e) {}
            return dateStr || '';
        };

        // Path dari CMS (mis. "/uploads/File Panduan.pdf") jadi URL absolut yang aman
        function fileHref(p) {
            if (!p) return '';
            let s = String(p).trim();
            if (/^https?:\/\//i.test(s)) return s;
            s = s.replace(/^\/+/, '');
            if (!s.includes('/')) s = 'uploads/' + s;
            return '/' + encodeURI(s);
        }

        const getFormatIcon = (format) => {
            const fmt = (format || 'FILE').toUpperCase();
            if (fmt === 'ZIP') return `<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>`;
            if (fmt === 'IMAGE' || fmt === 'JPG' || fmt === 'PNG') return `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>`;
            return `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>`;
        };

        function buildFilters() {
            const lang = getLang();
            const cats = [...new Set(repoData.map(d => d.category).filter(Boolean))];
            let html = `<button class="filter-btn active" onclick="filterRepo('all', this)">${lang === 'EN' ? 'All Documents' : 'Semua Dokumen'}</button>`;
            cats.forEach(cat => { html += `<button class="filter-btn" onclick="filterRepo('${catId(cat)}', this)">${esc(cat)}</button>`; });
            document.getElementById('filterContainer').innerHTML = html;
        }

        async function loadRepository() {
            const container = document.getElementById('repoList');
            const lang = getLang();
            try {
                // Data dari situs sendiri (bukan GitHub API), jadi tidak kena batas 60 request/jam
                const res = await fetch('/api/repository.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const items = await res.json();

                repoData = items.map(fm => {
                    const fmt = String(fm.format || '').toUpperCase();
                    fm.canPreview = (fmt === 'PDF' || fmt === 'IMAGE' || fmt === 'JPG' || fmt === 'PNG');
                    return fm;
                });
                repoData.sort((a, b) => new Date(String(b.date).replace(/-/g, '/')) - new Date(String(a.date).replace(/-/g, '/')));

                if (repoData.length === 0) {
                    container.innerHTML = `<div class="empty-state">${lang === 'EN' ? 'No documents available.' : 'Belum ada dokumen yang tersedia.'}</div>`;
                    return;
                }
                buildFilters();
                renderRepoList(repoData, lang);
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="empty-state" style="color:#ef4444;">${lang === 'EN' ? 'Failed to load documents.' : 'Gagal memuat dokumen.'} <small>(${esc(error.message)})</small></div>`;
            }
        }

        function renderRepoList(dataToRender, lang) {
            const container = document.getElementById('repoList');
            if (dataToRender.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding: 40px; text-align: center; color: var(--text-muted);">${lang === 'EN' ? 'No matching documents found.' : 'Dokumen tidak ditemukan.'}</div>`;
                return;
            }

            container.innerHTML = dataToRender.map((fm) => {
                const index = repoData.indexOf(fm);
                const title = lang === 'EN' ? (fm.title_en || fm.title_id) : (fm.title_id || fm.title_en);
                const href = fileHref(fm.file_url);
                const unavailable = lang === 'EN' ? 'File not available for download.' : 'File belum tersedia untuk diunduh.';
                const dlAttrs = href ? `href="${href}" target="_blank" rel="noopener" download` : `href="#" onclick="showToast('${unavailable}'); return false;"`;
                const titleAction = fm.canPreview ? `onclick="openBookModal(${index})"` : ``;
                const hoverStyle = fm.canPreview ? `style="cursor: pointer;" title="${lang === 'EN' ? 'Click to preview document' : 'Klik untuk melihat dokumen'}"` : `style="cursor: default;"`;

                return `
                <div class="repo-item" data-category="${catId(fm.category)}">
                    <div class="repo-left">
                        <div class="repo-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${getFormatIcon(fm.format)}</svg>
                        </div>
                        <div class="repo-details" ${titleAction} ${hoverStyle}>
                            <h3 class="repo-title">${esc(title)}</h3>
                            <div class="repo-meta">
                                <span style="font-weight:700; color:var(--primary-green); padding: 2px 8px; background: rgba(10,54,34,0.1); border-radius: 4px;">${esc(fm.format || 'FILE')}</span>
                                ${fm.size ? `<span>${esc(fm.size)}</span>` : ''}
                                <span>${lang === 'EN' ? 'Updated' : 'Diperbarui'} ${formatDate(fm.date)}</span>
                                ${fm.category ? `<span style="color: var(--primary-green); font-weight:700;">${esc(fm.category)}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="repo-actions">
                        ${fm.canPreview ? `<button class="filter-btn" style="padding: 10px 15px; border-color: var(--primary-green); color: var(--primary-green);" onclick="openBookModal(${index})" title="Preview" aria-label="Preview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>` : ''}
                        <a ${dlAttrs} class="repo-download">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            <span>${lang === 'EN' ? 'Download' : 'Unduh'}</span>
                        </a>
                    </div>
                </div>`;
            }).join('');
        }

        function filterRepo(category, btn) {
            document.querySelectorAll('.filter-tabs .filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.querySelectorAll('.repo-item').forEach(item => {
                item.style.display = (category === 'all' || item.getAttribute('data-category') === category) ? 'flex' : 'none';
            });
        }

        document.getElementById('repoSearchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.filter-tabs .filter-btn').forEach(b => b.classList.remove('active'));
            const allBtn = document.querySelector('.filter-tabs .filter-btn:first-child');
            if (allBtn) allBtn.classList.add('active');
            document.querySelectorAll('.repo-item').forEach(item => {
                const title = item.querySelector('.repo-title').innerText.toLowerCase();
                const cat = (item.getAttribute('data-category') || '').toLowerCase();
                item.style.display = (title.includes(term) || cat.includes(term)) ? 'flex' : 'none';
            });
        });

        // ===== FLIPBOOK 3D: library baru dimuat saat dokumen pertama dibuka =====
        const DFLIP_BASE = 'https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/';
        // false = flipbook ringan (tetap ada efek balik halaman, tanpa mesin WebGL yang berat).
        // Ganti ke true kalau mau efek 3D penuh dan rela menunggu lebih lama.
        const USE_WEBGL = false;
        let flipLoading = null;

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('Gagal memuat ' + src));
                document.body.appendChild(s);
            });
        }
        function loadCss(href) {
            const l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = href;
            document.head.appendChild(l);
        }
        function loadFlipbookLib() {
            if (window.jQuery && window.jQuery.fn && window.jQuery.fn.flipBook) return Promise.resolve();
            if (flipLoading) return flipLoading;
            window.dFlipLocation = DFLIP_BASE;
            loadCss(DFLIP_BASE + 'css/dflip.min.css');
            loadCss(DFLIP_BASE + 'css/themify-icons.min.css');
            const jq = (window.jQuery) ? Promise.resolve() : loadScript('https://code.jquery.com/jquery-3.6.0.min.js');
            flipLoading = jq.then(() => loadScript(DFLIP_BASE + 'js/dflip.min.js')).catch(err => { flipLoading = null; throw err; });
            return flipLoading;
        }

        function openBookModal(index) {
            const fm = repoData[index];
            if (!fm || !fm.canPreview) return;
            const lang = getLang();
            const fileUrl = fileHref(fm.file_url);
            const fmt = String(fm.format || '').toUpperCase();
            const container = document.getElementById('flipbook-container');
            document.getElementById('book-modal').classList.add('show');

            const failMsg = () => {
                container.innerHTML = `<div style="text-align:center; padding: 50px; color: #fff; font-weight: 700;">${lang === 'EN' ? 'Preview is unavailable.' : 'Pratinjau tidak tersedia.'}<br><a href="${fileUrl}" target="_blank" rel="noopener" style="color: var(--puserve-yellow);">${lang === 'EN' ? 'Open the file directly' : 'Buka file langsung'}</a></div>`;
            };

            if (fmt === 'PDF') {
                const flipId = 'flipbook-' + index;
                container.innerHTML = `<div id="${flipId}" style="width:100%;height:100%;"><div class="book-loading"><div class="book-spinner"></div><div>${lang === 'EN' ? 'Loading document...' : 'Memuat dokumen...'}</div><div style="font-weight:500; font-size:0.9rem; margin-top:8px; opacity:0.85;">${lang === 'EN' ? 'The first time can take a moment.' : 'Pertama kali bisa agak lama.'} <a href="${fileUrl}" target="_blank" rel="noopener">${lang === 'EN' ? 'Open the file directly' : 'Buka file langsung'}</a></div></div></div>`;
                loadFlipbookLib().then(() => {
                    const el = window.jQuery('#' + flipId);
                    el.empty();
                    el.flipBook(fileUrl, { webgl: USE_WEBGL, height: '100%', backgroundColor: 'transparent', autoEnableOutline: false, autoEnableThumbnail: false });
                }).catch(err => { console.error(err); failMsg(); });
            } else {
                container.innerHTML = `<img src="${fileUrl}" alt="" style="width:100%; height:100%; object-fit:contain; border-radius:12px; background:var(--card-bg);" onerror="this.onerror=null; this.remove();">`;
            }
        }

        function closeBookModal() {
            document.getElementById('book-modal').classList.remove('show');
            document.getElementById('flipbook-container').innerHTML = '';
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBookModal(); });

        // Pemanasan: library flipbook mulai diunduh saat kursor/jari menyentuh tombol pratinjau
        ['mouseover', 'touchstart'].forEach(evt => {
            document.getElementById('repoList').addEventListener(evt, (e) => {
                if (e.target.closest('[onclick*="openBookModal"]')) loadFlipbookLib().catch(() => {});
            }, { passive: true });
        });

        document.addEventListener("DOMContentLoaded", loadRepository);

        const langToggleCustom = document.getElementById('langToggle');
        if (langToggleCustom) {
            langToggleCustom.addEventListener('click', () => { setTimeout(() => { buildFilters(); renderRepoList(repoData, getLang()); }, 100); });
        }
    </script>
</body>
</html>
