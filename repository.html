---
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    
    <title>Public Repository | PUSERVE</title>
    
    <meta property="og:title" content="Public Repository | PUSERVE">
    <meta property="og:description" content="Official documents, guidelines, and public resources of PUSERVE.">
    <meta property="og:image" content="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .filter-tabs { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;}
        .filter-btn { padding: 10px 25px; border-radius: 30px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 0.95rem; }
        .filter-btn:hover, .filter-btn.active { background: var(--primary-green); color: white; border-color: var(--primary-green); }

        .repo-list { display: flex; flex-direction: column; gap: 20px; }
        .repo-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 25px 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; transition: 0.4s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .repo-item:hover { transform: translateY(-5px); border-color: var(--puserve-yellow); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        
        .repo-left { display: flex; align-items: center; gap: 25px; flex: 1; }
        .repo-icon { width: 50px; height: 50px; background: rgba(10, 54, 34, 0.05); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: var(--primary-green); flex-shrink: 0; }
        body.eco-mode .repo-icon { background: rgba(255,255,255,0.05); color: var(--puserve-yellow); }
        
        .repo-details { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
        .repo-title { font-size: 1.2rem; color: var(--text-color); font-weight: 700; transition: color 0.3s;}
        .repo-item:hover .repo-title { color: var(--primary-green); }
        body.eco-mode .repo-item:hover .repo-title { color: var(--puserve-yellow); }
        .repo-meta { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; display: flex; gap: 15px; flex-wrap: wrap;}
        
        .repo-actions { display: flex; gap: 10px; align-items: center; }
        .repo-download { padding: 12px 25px; background: var(--puserve-yellow); color: var(--dark-green); border-radius: 10px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; white-space: nowrap;}
        .repo-download:hover { background: var(--primary-green); color: white; transform: scale(1.05); }

        .repo-search-container { max-width: 600px; margin: 0 auto 30px auto; width: 100%; }
        .repo-search-input { width: 100%; padding: 15px 25px; border-radius: 30px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-size: 1rem; outline: none; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .repo-search-input:focus { border-color: var(--primary-green); box-shadow: 0 5px 20px rgba(10, 54, 34, 0.1); }
        body.eco-mode .repo-search-input:focus { border-color: var(--puserve-yellow); }

        /* BOOK POP-UP MODAL (Diperlebar biar baca PDF enak) */
        #book-modal .modal-content-box { max-width: 900px; width: 95%; max-height: 90vh; padding: 40px 50px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--card-border); box-shadow: 0 25px 50px rgba(0,0,0,0.3); display: flex; flex-direction: column;}
        .book-meta { padding-bottom: 15px; border-bottom: 2px solid var(--card-border); margin-bottom: 20px; flex-shrink: 0; }
        .book-content { flex: 1; min-height: 50vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #e5e5e5; border-radius: 8px; }
        body.eco-mode .book-content { background: #1a1a1a; }
        
        /* IFRAME PDF & IMG VIEWER */
        .book-content iframe, .book-content img { width: 100%; height: 100%; object-fit: contain; border: none; }

        @media (max-width: 768px) {
            .repo-item { flex-direction: column; align-items: flex-start; padding: 20px; }
            .repo-actions { width: 100%; justify-content: space-between; }
            .repo-download { width: 100%; justify-content: center; }
            #book-modal .modal-content-box { padding: 30px 20px; max-height: 85vh;}
            .book-content { min-height: 60vh; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>

    {% include navbar.html %}

    <header class="page-hero">
        <h1 data-en="Public Repository" data-id="Repositori Publik">Public Repository</h1>
        <p style="font-size: 1.1rem; opacity: 0.9;" data-en="Official documents, guidebooks, and public resources of PUSERVE." data-id="Dokumen resmi, buku panduan, dan sumber daya publik PUSERVE.">Official documents, guidebooks, and public resources of PUSERVE.</p>
    </header>

    <main class="container">
        
        <div class="repo-search-container">
            <input type="text" id="repoSearchInput" class="repo-search-input" placeholder="Search documents..." data-en="Search documents..." data-id="Cari dokumen...">
        </div>

        <div class="filter-tabs" id="filterContainer">
            <button class="filter-btn active" onclick="filterRepo('all')" data-en="All Documents" data-id="Semua Dokumen">All Documents</button>
        </div>

        <div class="repo-list" id="repoList">
            <div class="skeleton-card" style="height: 100px; max-width: 100%; flex-direction: row; align-items: center; padding: 20px;"><div class="skeleton" style="width: 50px; height: 50px; border-radius: 12px; margin-right: 20px;"></div><div style="flex:1;"><div class="skeleton" style="width: 40%; height: 20px; margin-bottom: 10px;"></div><div class="skeleton" style="width: 30%; height: 15px;"></div></div></div>
        </div>
    </main>

    <!-- BOOK POP-UP MODAL (Viewer PDF / Gambar) -->
    <div id="book-modal" class="modal-overlay">
        <div class="modal-content-box">
            <span class="close-modal-btn" onclick="closeBookModal()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span>
            <div class="book-meta">
                <div style="color: var(--puserve-yellow); font-weight: 800; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px;" id="book-category">CATEGORY</div>
                <h2 id="book-title" style="font-size: 1.6rem; color: var(--text-color); margin-bottom: 10px; line-height: 1.2;">Document Title</h2>
            </div>
            <div class="book-content" id="book-content">
                <!-- PDF atau Gambar akan muncul di sini otomatis -->
            </div>
        </div>
    </div>

    {% include footer.html %}

    <script>
        let repoData = [];
        let categories = new Set();

        const formatDate = (dateStr) => { try { const d = new Date(dateStr); if (!isNaN(d)) return d.toLocaleDateString(localStorage.getItem('puserve_lang') === 'EN' ? 'en-US' : 'id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); } catch(e){} return dateStr; };

        const getFormatIcon = (format) => {
            const fmt = (format || 'FILE').toUpperCase();
            if(fmt === 'ZIP') return `<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>`;
            if(fmt === 'IMAGE' || fmt === 'JPG' || fmt === 'PNG') return `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>`;
            return `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>`;
        };

        async function loadRepository() {
            const container = document.getElementById('repoList');
            const filterContainer = document.getElementById('filterContainer');
            let currentLang = localStorage.getItem('puserve_lang') || 'EN';
            const emptyMsg = currentLang === 'EN' ? 'No documents available.' : 'Belum ada dokumen yang tersedia.';

            try {
                const res = await fetch(`https://api.github.com/repos/puserve/puserve.github.io/contents/_repository`);
                if (!res.ok) throw new Error("API Error");
                const files = await res.json();
                
                repoData = [];
                categories.clear();

                for (const file of files) {
                    if (!file.name.endsWith('.md') || file.name.startsWith('TEMPLATE')) continue;
                    const mdText = await (await fetch(file.download_url)).text();
                    const parts = mdText.split('---');
                    if (parts.length >= 3) {
                        const fm = jsyaml.load(parts[1]); 
                        
                        // Cek apakah file bisa di-preview (PDF, Image, Video)
                        const fmt = (fm.format || '').toUpperCase();
                        fm.canPreview = (fmt === 'PDF' || fmt === 'IMAGE' || fmt === 'JPG' || fmt === 'PNG');
                        
                        repoData.push(fm);
                        if(fm.category) categories.add(fm.category);
                    }
                }

                let filterHTML = `<button class="filter-btn active" onclick="filterRepo('all')" data-en="All Documents" data-id="Semua Dokumen">${currentLang === 'EN' ? 'All Documents' : 'Semua Dokumen'}</button>`;
                categories.forEach(cat => {
                    const safeCatId = cat.toLowerCase().replace(/[^a-z0-9]/g, '-');
                    filterHTML += `<button class="filter-btn" onclick="filterRepo('${safeCatId}')">${cat}</button>`;
                });
                filterContainer.innerHTML = filterHTML;

                if (repoData.length === 0) { container.innerHTML = `<div class="empty-state">${emptyMsg}</div>`; return; }

                repoData.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderRepoList(repoData, currentLang);

            } catch (error) { 
                container.innerHTML = `<div class="empty-state">Failed to load repository data.</div>`; 
            }
        }

        function renderRepoList(dataToRender, lang) {
            const container = document.getElementById('repoList');
            if (dataToRender.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding: 40px; text-align: center; color: var(--text-muted);">${lang === 'EN' ? 'No matching documents found.' : 'Dokumen tidak ditemukan.'}</div>`;
                return;
            }

            container.innerHTML = dataToRender.map((fm, index) => {
                const title = lang === 'EN' ? (fm.title_en || fm.title_id) : (fm.title_id || fm.title_en);
                const safeCatId = (fm.category || '').toLowerCase().replace(/[^a-z0-9]/g, '-');
                
                // Perbaiki path URL file (Mencegah GitHub Pages nyari ke root folder yang salah)
                let fileUrl = '#';
                if(fm.file_url) {
                    fileUrl = fm.file_url.startsWith('/') ? fm.file_url.slice(1) : fm.file_url;
                    if(!fileUrl.includes('uploads/')) fileUrl = `uploads/${fileUrl}`;
                }

                const dlClick = fileUrl === '#' ? `onclick="showToast('${lang === 'EN' ? 'File not available for download.' : 'File belum tersedia untuk diunduh.}'); return false;"` : `target="_blank"`;
                
                // Kalau bisa di-preview, klik judul / icon mata akan buka Pop-up
                const titleAction = fm.canPreview ? `onclick="openBookModal(${index})"` : ``;
                const hoverStyle = fm.canPreview ? `style="cursor: pointer;" title="${lang==='EN'?'Click to preview document':'Klik untuk melihat dokumen'}"` : `style="cursor: default;"`;

                return `
                <div class="repo-item" data-category="${safeCatId}">
                    <div class="repo-left">
                        <div class="repo-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                ${getFormatIcon(fm.format)}
                            </svg>
                        </div>
                        <div class="repo-details" ${titleAction} ${hoverStyle}>
                            <h3 class="repo-title">${title}</h3>
                            <div class="repo-meta">
                                <span style="font-weight:700; color:var(--primary-green); padding: 2px 8px; background: rgba(10,54,34,0.1); border-radius: 4px;">${fm.format || 'FILE'}</span>
                                <span>${fm.size ? `💾 ${fm.size}` : ''}</span>
                                <span>📅 ${lang === 'EN' ? 'Updated' : 'Diperbarui'} ${formatDate(fm.date)}</span>
                                <span style="color: var(--puserve-yellow); font-weight:700;">${fm.category || ''}</span>
                            </div>
                        </div>
                    </div>
                    <div class="repo-actions">
                        ${fm.canPreview ? `<button class="filter-btn" style="padding: 10px 15px; border-color: var(--primary-green); color: var(--primary-green);" onclick="openBookModal(${index})" title="Preview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>` : ''}
                        <a href="${fileUrl}" class="repo-download" ${dlClick}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 
                            <span>${lang === 'EN' ? 'Download' : 'Unduh'}</span>
                        </a>
                    </div>
                </div>`;
            }).join('');
        }

        function filterRepo(category) {
            document.querySelectorAll('.filter-tabs .filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.repo-item').forEach(item => {
                if(category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        document.getElementById('repoSearchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.filter-tabs .filter-btn').forEach(btn => btn.classList.remove('active'));
            const allBtn = document.querySelector('.filter-tabs .filter-btn:first-child');
            if(allBtn) allBtn.classList.add('active'); 

            document.querySelectorAll('.repo-item').forEach(item => {
                const title = item.querySelector('.repo-title').innerText.toLowerCase();
                const cat = (item.getAttribute('data-category') || '').toLowerCase();
                item.style.display = (title.includes(term) || cat.includes(term)) ? 'flex' : 'none';
            });
        });

        // MESIN BACA BUKU / PREVIEW (Otomatis nampilin PDF/Gambar)
        function openBookModal(index) {
            const fm = repoData[index];
            if(!fm || !fm.canPreview) return;

            const lang = localStorage.getItem('puserve_lang') || 'EN';
            const title = lang === 'EN' ? (fm.title_en || fm.title_id) : (fm.title_id || fm.title_en);
            
            // Format URL (Biar akurat dicari di folder uploads)
            let fileUrl = '#';
            if(fm.file_url) {
                fileUrl = fm.file_url.startsWith('/') ? fm.file_url.slice(1) : fm.file_url;
                if(!fileUrl.includes('uploads/')) fileUrl = `uploads/${fileUrl}`;
            }

            document.getElementById('book-category').innerText = fm.category || 'DOCUMENT';
            document.getElementById('book-title').innerText = title;
            
            const contentBox = document.getElementById('book-content');
            const fmt = (fm.format || '').toUpperCase();
            
            // Tampilkan File Asli
            if (fmt === 'PDF') {
                contentBox.innerHTML = `<iframe src="${fileUrl}#toolbar=0" title="${title}"></iframe>`;
            } else if (fmt === 'IMAGE' || fmt === 'JPG' || fmt === 'PNG') {
                contentBox.innerHTML = `<img src="${fileUrl}" alt="${title}">`;
            } else {
                contentBox.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">Preview not supported. Please download the file.</div>`;
            }

            document.getElementById('book-modal').classList.add('show');
        }

        function closeBookModal() {
            document.getElementById('book-modal').classList.remove('show');
            // Matikan iframe biar enteng kalau modal ditutup
            document.getElementById('book-content').innerHTML = '';
        }

        document.addEventListener("DOMContentLoaded", loadRepository);

        const langToggleCustom = document.getElementById('langToggle');
        if(langToggleCustom) {
            langToggleCustom.addEventListener('click', () => { setTimeout(() => { let currentLang = localStorage.getItem('puserve_lang') || 'EN'; renderRepoList(repoData, currentLang); }, 100); });
        }
    </script>
</body>
</html>
