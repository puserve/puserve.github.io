<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>PUSERVE | Admin Dashboard</title>
    <link rel="icon" type="image/png" href="../logos/LOGO_PUSERVE.png">

    <!--
      PENTING: JANGAN load ../style.css di sini.
      CSS situs akan nimpa tampilan Sveltia CMS (layout, modal, blur, dll) dan bikin dashboard rusak.
      Style situs cukup didaftarin lewat CMS.registerPreviewStyle() di bawah,
      karena itu cuma dipasang di dalam panel preview.
    -->

    <!-- Markdown parser buat preview -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // CSS situs HANYA untuk panel preview (di-inject ke iframe preview, bukan ke dashboard)
      CMS.registerPreviewStyle("/style.css");

      var globalStyles = h('style', null, `
        .preview-content p { margin-bottom: 1.5em; line-height: 1.8; color: #334155; }
        .preview-content h1, .preview-content h2, .preview-content h3 { color: var(--dark-green); margin-top: 1.5em; margin-bottom: 0.5em; }
        .preview-content ul, .preview-content ol { margin-bottom: 1.5em; padding-left: 20px; }
        .preview-content li { margin-bottom: 0.5em; }
      `);

      // --- HELPER ---
      // Ambil teks bahasa Inggris saja (sebelum penanda ===ID===).
      // Toleran: tetap kebaca walau ===ID=== ke-bold di editor (**===ID===**)
      function getEnglishBody(entry) {
        var rawBody = entry.getIn(['data', 'body']) || '';
        return String(rawBody).split(/^[\s*_]*===ID===[\s*_]*$/m)[0].trim();
      }

      // Pastikan tanggal selalu jadi string (objek Date bikin React error)
      function formatDate(value, fallback) {
        if (!value) return fallback;
        try {
          var d = new Date(value);
          if (!isNaN(d)) {
            return d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
          }
        } catch (e) {}
        return String(value);
      }

      // Estimasi waktu baca (200 kata per menit)
      function readingTime(text) {
        var words = text ? text.split(/\s+/).filter(Boolean).length : 0;
        return Math.max(1, Math.ceil(words / 200)) + ' min read';
      }

      // Label status acara (sama seperti di halaman Events)
      var STATUS_LABEL = { ongoing: 'On Going', upcoming: 'Upcoming', latest: 'Latest' };

      // --- TEMPLATE NEWS ---
      var NewsPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title_en']) || entry.getIn(['data', 'title_id']) || 'Ketik Judul Berita...';
          var date = formatDate(entry.getIn(['data', 'date']), 'November 2, 2026');
          var author = entry.getIn(['data', 'author']) || 'PUSERVE Editorial';
          var quote = entry.getIn(['data', 'quote']);
          var image = entry.getIn(['data', 'thumbnail']);

          var enBody = getEnglishBody(entry);
          var htmlBody = marked.parse(enBody);

          var imgHtml = image ? h('img', {src: this.props.getAsset(image).toString(), style: {width: '100%', borderRadius: '16px', marginBottom: '30px', objectFit: 'cover'}}) : null;

          var quoteHtml = quote ? h('div', {style: {background: '#f8fafc', borderLeft: '4px solid var(--puserve-yellow)', padding: '25px', borderRadius: '12px', marginTop: '30px', marginBottom: '30px'}},
            h('div', {style: {color: 'var(--puserve-yellow)', fontWeight: '800', fontSize: '0.85rem', letterSpacing: '1px', marginBottom: '10px', textTransform: 'uppercase'}}, 'KEY QUOTE'),
            h('p', {style: {fontStyle: 'italic', fontSize: '1.1rem', fontWeight: '600', color: 'var(--text-color)', margin: '0'}}, '"' + quote + '"')
          ) : null;

          return h('div', {className: 'container', style: {padding: '40px 20px', backgroundColor: '#ffffff', color: 'var(--text-color)', minHeight: '100vh', maxWidth: '800px', margin: '0 auto', fontFamily: 'Manrope, sans-serif'}},
            globalStyles,
            h('div', {style: {display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--text-muted)', fontSize: '0.9rem', fontWeight: '600', marginBottom: '40px'}},
              h('span', null, '←'), h('span', null, 'Back to Outlook')
            ),
            h('div', {style: {textAlign: 'center', marginBottom: '40px'}},
              h('div', {style: {color: 'var(--puserve-yellow)', fontWeight: '800', fontSize: '0.85rem', letterSpacing: '1px', textTransform: 'uppercase', marginBottom: '15px'}}, 'PUSERVE OUTLOOK REPORT'),
              h('h1', {style: {fontSize: '2.5rem', color: 'var(--dark-green)', fontWeight: '900', marginBottom: '20px', lineHeight: '1.2'}}, title),
              h('div', {style: {display: 'flex', justifyContent: 'center', gap: '20px', color: 'var(--text-muted)', fontSize: '0.85rem', fontWeight: '600', flexWrap: 'wrap'}},
                h('span', null, '📍 Jakarta, ID'),
                h('span', null, '📅 ' + date),
                h('span', null, '👤 ' + author),
                h('span', null, '⏱️ ' + readingTime(enBody))
              )
            ),
            imgHtml,
            h('div', {className: 'preview-content', dangerouslySetInnerHTML: {__html: htmlBody}}),
            quoteHtml
          );
        }
      });
        /* IMPACT ICONS + DIVIDER */
.impact-icon { display: block; margin: 0 auto 12px; color: var(--primary-green); }
body.eco-mode .impact-icon { color: var(--puserve-yellow); }
.impact-item + .impact-item { border-left: 1px solid var(--card-border); }
.campaign-current { margin-top: 14px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
@media screen and (max-width: 768px) { .impact-item + .impact-item { border-left: none; } }

      
      // --- TEMPLATE EVENTS ---
      var EventPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title_en']) || entry.getIn(['data', 'title_id']) || 'Ketik Nama Acara...';
          var date = formatDate(entry.getIn(['data', 'date']), 'November 2, 2026');
          var rawStatus = entry.getIn(['data', 'status']);
          var status = STATUS_LABEL[rawStatus] || rawStatus || 'Upcoming';
          var attendees = entry.getIn(['data', 'attendees']) || '200+ Participants';
          var outcome = entry.getIn(['data', 'outcome_en']) || entry.getIn(['data', 'outcome']);
          var image = entry.getIn(['data', 'thumbnail']);

          var enBody = getEnglishBody(entry);
          var htmlBody = marked.parse(enBody);

          var imgHtml = image ? h('img', {src: this.props.getAsset(image).toString(), style: {width: '100%', borderRadius: '16px', marginBottom: '30px', objectFit: 'cover'}}) : null;

          var outcomeHtml = outcome ? h('div', {style: {background: 'rgba(10,54,34,0.05)', border: '1px solid rgba(10,54,34,0.1)', padding: '20px', borderRadius: '12px', marginTop: '30px', marginBottom: '30px'}},
            h('div', {style: {color: 'var(--primary-green)', fontWeight: '800', fontSize: '0.85rem', letterSpacing: '1px', marginBottom: '10px', textTransform: 'uppercase'}}, 'PROGRAM OUTCOME'),
            h('p', {style: {fontSize: '1rem', fontWeight: '600', color: 'var(--dark-green)', margin: '0'}}, outcome)
          ) : null;

          return h('div', {className: 'container', style: {padding: '40px 20px', backgroundColor: '#ffffff', color: 'var(--text-color)', minHeight: '100vh', maxWidth: '800px', margin: '0 auto', fontFamily: 'Manrope, sans-serif'}},
            globalStyles,
            h('div', {style: {display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--text-muted)', fontSize: '0.9rem', fontWeight: '600', marginBottom: '40px'}},
              h('span', null, '←'), h('span', null, 'Back to Events')
            ),
            h('div', {style: {marginBottom: '40px'}},
              h('span', {style: {background: 'var(--puserve-yellow)', color: 'var(--dark-green)', padding: '6px 15px', borderRadius: '20px', fontWeight: '800', fontSize: '0.85rem', textTransform: 'uppercase'}}, status),
              h('h1', {style: {fontSize: '2.5rem', color: 'var(--dark-green)', fontWeight: '900', marginTop: '20px', marginBottom: '20px', lineHeight: '1.2'}}, title),
              h('div', {style: {display: 'flex', gap: '20px', color: 'var(--text-muted)', fontSize: '0.85rem', fontWeight: '600', flexWrap: 'wrap'}},
                h('span', null, '📍 President University'),
                h('span', null, '📅 ' + date),
                h('span', null, '👥 ' + attendees)
              )
            ),
            imgHtml,
            h('div', {className: 'preview-content', dangerouslySetInnerHTML: {__html: htmlBody}}),
            outcomeHtml
          );
        }
      });

      CMS.registerPreviewTemplate("news", NewsPreview);
      CMS.registerPreviewTemplate("events", EventPreview);
    </script>
  </body>
</html>
