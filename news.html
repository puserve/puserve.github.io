<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook | PUSERVE</title>
    <meta name="description" content="Latest environmental news, opinions, and analysis from PUSERVE, President University.">
    <meta property="og:title" content="Outlook | PUSERVE">
    <meta property="og:description" content="Latest Environmental News, Opinions, and Analysis.">
    <meta property="og:image" content="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    {% include navbar.html %}

    <header class="page-hero">
        <h1 data-en="PUSERVE OUTLOOK" data-id="PUSERVE OUTLOOK">PUSERVE OUTLOOK</h1>
        <p style="font-size: 1.1rem; opacity: 0.9;" data-en="Latest Environmental News, Opinions, and Analysis." data-id="Berita, Opini, dan Analisis Lingkungan Terkini.">Latest Environmental News, Opinions, and Analysis.</p>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search news..." data-en="Search news..." data-id="Cari berita...">
        </div>
    </header>

    <main class="container">
        <div class="section-header"><h2 class="section-title" data-en="Highlight" data-id="Sorotan">Highlight</h2><div class="section-line"></div></div>
        <div id="grid-highlight" class="events-grid">
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
        </div>

        <div class="section-header"><h2 class="section-title" data-en="Latest News" data-id="Berita Terbaru">Latest News</h2><div class="section-line"></div></div>
        <div id="grid-latest" class="events-grid">
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
        </div>

        <div class="section-header"><h2 class="section-title" data-en="Archive" data-id="Arsip">Archive</h2><div class="section-line"></div></div>
        <div id="grid-archive" class="events-grid">
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
        </div>
    </main>

    {% include footer.html %}

<script>
    const getLang = () => localStorage.getItem('puserve_lang') || 'EN';
    const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    // Tanggal dari CMS dianggap waktu Jakarta (WIB, +07:00); aman di semua browser
    const parseJakarta = (s) => new Date(String(s || '').replace(' ', 'T') + '+07:00');

    function formatDate(dateStr) {
        try {
            const d = parseJakarta(dateStr);
            if (!isNaN(d)) return d.toLocaleDateString(getLang() === 'EN' ? 'en-US' : 'id-ID', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta' });
        } catch (e) {}
        return dateStr || '';
    }

    function assetUrl(p, fallback) {
        if (!p) return fallback;
        let s = String(p).trim();
        if (/^https?:\/\//i.test(s)) return s;
        s = s.replace(/^\/+/, '');
        if (!s.includes('/')) s = 'uploads/' + s;
        return '/' + encodeURI(s);
    }

    async function loadCatalog() {
        const grids = {
            highlight: document.getElementById('grid-highlight'),
            latest: document.getElementById('grid-latest'),
            archive: document.getElementById('grid-archive')
        };
        const lang = getLang();
        const emptyMsg = lang === 'EN' ? 'No records published yet.' : 'Belum ada catatan di kategori ini.';

        try {
            const res = await fetch('/api/news.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const files = await res.json();

            const data = { highlight: [], latest: [], archive: [] };
            const now = new Date();

            for (const fm of files) {
                if (!fm.title_en && !fm.title_id) continue;
                const published = parseJakarta(fm.date);
                // Berita terjadwal (tanggal di masa depan) belum ditampilkan di daftar
                if (!isNaN(published) && published > now) continue;

                const diffDays = isNaN(published) ? 999 : Math.floor((now - published) / 86400000);
                if (diffDays <= 3) data.highlight.push(fm);
                else if (diffDays <= 7) data.latest.push(fm);
                else data.archive.push(fm);
            }

            Object.keys(data).forEach(key => {
                if (!grids[key]) return;
                data[key].sort((a, b) => parseJakarta(b.date) - parseJakarta(a.date));
                if (data[key].length === 0) { grids[key].innerHTML = `<div class="empty-state">${emptyMsg}</div>`; return; }
                grids[key].innerHTML = data[key].map(fm => {
                    const title = lang === 'EN' ? (fm.title_en || fm.title_id) : (fm.title_id || fm.title_en);
                    const img = assetUrl(fm.thumbnail, '/logos/LOGO_PUSERVE.png');
                    return `
                    <a href="${fm.url}" class="card trans-link">
                        <img src="${img}" class="card-img" alt="" onerror="this.onerror=null;this.src='/logos/LOGO_PUSERVE.png'">
                        <div class="card-body">
                            <span class="card-tag">${esc(fm.status || 'Outlook News')}</span>
                            <h3 class="card-title">${esc(title)}</h3>
                            <div class="card-meta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${formatDate(fm.date)}</div>
                        </div>
                    </a>`;
                }).join('');
            });
        } catch (error) {
            console.error(error);
            Object.values(grids).forEach(grid => { if (grid) grid.innerHTML = `<div class="empty-state" style="color:#ef4444;">${lang === 'EN' ? 'Failed to load data.' : 'Gagal memuat data.'} <small>(${esc(error.message)})</small></div>`; });
        }
    }

    document.addEventListener("DOMContentLoaded", loadCatalog);

    document.getElementById('searchInput').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            const title = card.querySelector('.card-title').innerText.toLowerCase();
            card.style.display = title.includes(term) ? 'flex' : 'none';
        });
    });

    const langToggleCustom = document.getElementById('langToggle');
    if (langToggleCustom) {
        langToggleCustom.addEventListener('click', () => { setTimeout(() => { loadCatalog(); }, 100); });
    }
</script>
</body>
</html>
