<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUSERVE OUTLOOK | News & Insights</title>
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <style>
        /* TEMA VVIP SAMA PERSIS KAYA EVENTS */
        :root { --dark-green: #051810; --puserve-green: #0a2618; --card-bg: #0f3522; --puserve-yellow: #fcd34d; --white: #ffffff; --gray-text: #8bada0; --border-color: #1a4d33; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--dark-green); color: var(--white); display: flex; flex-direction: column; min-height: 100vh; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: var(--dark-green); border-bottom: 1px solid var(--border-color); }
        .nav-logos { display: flex; align-items: center; gap: 15px; }
        .nav-logos img { height: 40px; width: auto; }
        .nav-links { display: flex; align-items: center; gap: 30px; }
        .nav-links a { color: var(--white); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--puserve-yellow); }
        .btn-join { background-color: var(--puserve-yellow); color: var(--dark-green); padding: 8px 22px; border-radius: 25px; font-weight: 700; font-size: 0.9rem; }

        header.hero { text-align: center; padding: 70px 20px 50px; background: radial-gradient(circle at top, var(--puserve-green) 0%, var(--dark-green) 100%); border-bottom: 1px solid var(--border-color); }
        .hero-title { color: var(--white); font-size: 2.8rem; margin-bottom: 15px; font-weight: 300; letter-spacing: 1px; }
        .hero-title strong { color: var(--puserve-yellow); font-weight: 700; }
        .hero-subtitle { color: var(--gray-text); font-size: 1.1rem; letter-spacing: 0.5px; }

        main.container { flex: 1; max-width: 1100px; margin: 0 auto; padding: 50px 20px; width: 100%; }
        .section-header { display: flex; align-items: center; margin-top: 50px; margin-bottom: 25px; }
        .section-title { color: var(--white); font-size: 1.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-right: 20px; }
        .section-line { flex: 1; height: 1px; background-color: var(--border-color); }
        .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        .empty-state { grid-column: 1 / -1; padding: 40px; text-align: center; background: rgba(255,255,255,0.02); border: 1px dashed var(--border-color); border-radius: 12px; color: var(--gray-text); font-size: 0.95rem; }

        .event-card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: all 0.3s ease; }
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); border-color: var(--puserve-yellow); }
        .event-img { width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid var(--border-color); }
        
        .event-content { padding: 25px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .event-status { display: inline-block; color: var(--puserve-yellow); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .event-title { font-size: 1.3rem; margin: 0 0 15px 0; color: var(--white); line-height: 1.4; font-weight: 600; }
        
        .event-meta { display: flex; flex-direction: column; gap: 8px; margin-bottom: 25px; }
        .meta-item { display: flex; align-items: center; color: var(--gray-text); font-size: 0.85rem; }
        .meta-item svg { width: 14px; height: 14px; margin-right: 10px; stroke: var(--puserve-yellow); }

        .read-more { display: flex; align-items: center; color: var(--white); font-size: 0.9rem; font-weight: 600; transition: 0.3s; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .read-more svg { width: 16px; height: 16px; margin-left: 8px; transition: 0.3s; }
        .event-card:hover .read-more { color: var(--puserve-yellow); }
        .event-card:hover .read-more svg { transform: translateX(5px); stroke: var(--puserve-yellow); }

        footer { background-color: var(--dark-green); text-align: center; padding: 30px 20px; color: var(--gray-text); border-top: 1px solid var(--border-color); font-size: 0.85rem; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logos">
            <img src="logos/LOGO_PU.png" alt="President University">
            <img src="logos/LOGO_CEDRS.png" alt="CEDRS">
            <img src="logos/LOGO_PUSERVE.png" alt="PUSERVE">
        </div>
 <div class="nav-links">
            <a href="index.html">About</a>
            <a href="events.html">Events</a>
            <a href="news.html" style="color: var(--puserve-yellow);">Outlook</a>
            <a href="easter_egg.jpeg" target="_blank" style="color: transparent; position: absolute; top: 0; right: 0; width: 20px; height: 20px;">.</a>
            <a href="#" class="btn-join">Join Us</a>
        </div>
    </nav>

    <header class="hero">
        <h1 class="hero-title"><strong>PUSERVE OUTLOOK</strong></h1>
        <p class="hero-subtitle">Latest Environmental News, Opinions, and Analysis</p>
    </header>

    <main class="container">
        <!-- HIGHLIGHT NEWS -->
        <div class="section-header">
            <h2 class="section-title">Highlight</h2>
            <div class="section-line"></div>
        </div>
        <div id="grid-highlight" class="events-grid">
            <div class="empty-state">No highlight news yet.</div>
        </div>

        <!-- LATEST NEWS -->
        <div class="section-header">
            <h2 class="section-title">Latest News</h2>
            <div class="section-line"></div>
        </div>
        <div id="grid-latest" class="events-grid">
            <div class="empty-state">No latest news yet.</div>
        </div>

        <!-- ARCHIVE -->
        <div class="section-header">
            <h2 class="section-title">Archive</h2>
            <div class="section-line"></div>
        </div>
        <div id="grid-archive" class="events-grid">
            <div class="empty-state">Archive is still empty.</div>
        </div>
    </main>

    <footer><p>&copy; 2026 PUSERVE - President University. All Rights Reserved.</p></footer>

    <script>
        const repoName = 'puserve/puserve.github.io'; 
        const folderName = '_news'; // SEKARANG NYEDOT DARI FOLDER _news

        async function loadCatalog() {
            const gridHighlight = document.getElementById('grid-highlight');
            const gridLatest = document.getElementById('grid-latest');
            const gridArchive = document.getElementById('grid-archive');

            try {
                const response = await fetch(`https://api.github.com/repos/${repoName}/contents/${folderName}`);
                const files = await response.json();

                let htmlHighlight = '', htmlLatest = '', htmlArchive = '';

                for (const file of files) {
                    if (file.name === 'TEMPLATE-NEWS.md' || !file.name.endsWith('.md')) continue;

                    const mdResponse = await fetch(file.download_url);
                    const mdText = await mdResponse.text();
                    const parts = mdText.split('---');

                    if (parts.length >= 3) {
                        const fm = jsyaml.load(parts[1]);

                        const getImgUrl = (img) => {
                            if (!img) return 'https://via.placeholder.com/400x250/0f3522/fcd34d?text=OUTLOOK';
                            if (img.startsWith('http')) return img;
                            if (img.includes('/')) return img;
                            return `uploads/${img}`;
                        };
                        let img = getImgUrl(fm.thumbnail);

                        let cleanDate = fm.date;
                        try {
                            const d = new Date(fm.date);
                            if (!isNaN(d)) cleanDate = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                        } catch(e){}

                        // PERHATIKAN LINKNYA SEKARANG MENUJU read-news.html
                        const cardHTML = `
                            <a href="read-news.html?file=${file.name}" class="event-card">
                                <img src="${img}" class="event-img" alt="Thumbnail" onerror="this.src='https://via.placeholder.com/400x250/0f3522/fcd34d?text=Image+Not+Found'">
                                <div class="event-content">
                                    <div>
                                        <span class="event-status">${fm.category || 'News'}</span>
                                        <h2 class="event-title">${fm.title}</h2>
                                        <div class="event-meta">
                                            <div class="meta-item">
                                                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                                ${cleanDate}
                                            </div>
                                            <div class="meta-item">
                                                <!-- Icon Pena / Author -->
                                                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                                                ${fm.author || 'PUSERVE Redaction Team'}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="read-more">
                                        Read Article 
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                                    </div>
                                </div>
                            </a>
                        `;

                        const category = (fm.category || '').toLowerCase();
                        if (category === 'highlight') htmlHighlight += cardHTML;
                        else if (category === 'archive') htmlArchive += cardHTML;
                        else htmlLatest += cardHTML; // Default masuk ke latest
                    }
                }

                if (htmlHighlight) gridHighlight.innerHTML = htmlHighlight;
                if (htmlLatest) gridLatest.innerHTML = htmlLatest;
                if (htmlArchive) gridArchive.innerHTML = htmlArchive;

            } catch (error) {
                console.error("Error:", error);
            }
        }
        loadCatalog();
    </script>
</body>
</html>
