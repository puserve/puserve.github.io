<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook | PUSERVE</title>
    <meta property="og:title" content="Outlook | PUSERVE">
    <meta property="og:description" content="Latest Environmental News, Opinions, and Analysis.">
    <meta property="og:image" content="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>

    {% include navbar.html %}

    <header class="page-hero">
        <h1 data-en="PUSERVE OUTLOOK" data-id="PUSERVE OUTLOOK">PUSERVE OUTLOOK</h1>
        <p style="font-size: 1.1rem; opacity: 0.9;" data-en="Latest Environmental News, Opinions, and Analysis." data-id="Berita, Opini, dan Analisis Lingkungan Terkini.">Latest Environmental News, Opinions, and Analysis.</p>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search news..." data-en="Search news..." data-id="Cari data berita...">
        </div>
    </header>

    <main class="container">
        <div class="section-header"><h2 class="section-title" data-en="Highlight" data-id="Sorotan">Highlight</h2><div class="section-line"></div></div>
        <div id="grid-highlight" class="events-grid">
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
        </div>

        <div class="section-header"><h2 class="section-title" data-en="Latest News" data-id="Berita Terbaru">Latest News</h2><div class="section-line"></div></div>
        <div id="grid-latest" class="events-grid">
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
        </div>

        <div class="section-header"><h2 class="section-title" data-en="Archive" data-id="Arsip">Archive</h2><div class="section-line"></div></div>
        <div id="grid-archive" class="events-grid">
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
        </div>
    </main>

    {% include footer.html %}

    <script>
        // Skrip khusus untuk narik data berita ke halaman ini
        async function loadCatalog() {
            const grids = { highlight: document.getElementById('grid-highlight'), latest: document.getElementById('grid-latest'), archive: document.getElementById('grid-archive') };
            let currentLang = localStorage.getItem('puserve_lang') || 'EN';
            const emptyMsg = currentLang === 'EN' ? 'No records published yet.' : 'Belum ada catatan di kategori ini.';

            try {
                const res = await fetch(`https://api.github.com/repos/puserve/puserve.github.io/contents/_news`);
                if (!res.ok) throw new Error("API Error");
                const files = await res.json();
                
                let data = { highlight: [], latest: [], archive: [] };
                for (const file of files) {
                    if (!file.name.endsWith('.md') || file.name.startsWith('TEMPLATE')) continue;
                    const mdText = await (await fetch(file.download_url)).text();
                    const parts = mdText.split('---');
                    if (parts.length >= 3) {
                        const fm = jsyaml.load(parts[1]); fm.fileName = file.name;
                        const cat = (fm.category || '').toLowerCase();
                        if (cat === 'highlight') data.highlight.push(fm);
                        else if (cat === 'archive') data.archive.push(fm);
                        else data.latest.push(fm);
                    }
                }

                Object.keys(data).forEach(key => {
                    data[key].sort((a, b) => new Date(b.date) - new Date(a.date));
                    if (data[key].length === 0) { grids[key].innerHTML = `<div class="empty-state">${emptyMsg}</div>`; } 
                    else {
                        grids[key].innerHTML = data[key].map(fm => `
                            <a href="read-news.html?file=${fm.fileName}" class="card trans-link">
                                <img src="${fm.thumbnail ? (fm.thumbnail.includes('/') ? fm.thumbnail : `uploads/${fm.thumbnail}`) : 'logos/LOGO_PUSERVE.png'}" class="card-img" onerror="this.src='logos/LOGO_PUSERVE.png'">
                                <div class="card-body">
                                    <span class="card-tag">${fm.category || 'News'}</span>
                                    <h3 class="card-title">${fm.title}</h3>
                                    <div class="card-meta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${fm.date}</div>
                                </div>
                            </a>
                        `).join('');
                    }
                });
            } catch (error) { Object.values(grids).forEach(grid => grid.innerHTML = `<div class="empty-state">Data loading... (Make sure you have Markdown files in _news folder)</div>`); }
        }
        
        document.addEventListener("DOMContentLoaded", loadCatalog);

        // LIVE SEARCH LOGIC
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const title = card.querySelector('.card-title').innerText.toLowerCase();
                card.style.display = title.includes(term) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
