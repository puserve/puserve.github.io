# ID formulir Formspree (bagian akhir alamat https://formspree.io/f/XXXXXXXX).
# Ini bukan kunci rahasia. Kalau pindah akun Formspree, ganti nilainya di sini saja.
formspree_id: "xzeegbpp"

# Alamat Web App Google Apps Script (berakhiran /exec) untuk form kontak, newsletter, dan balasan otomatis.
# Selama kosong, formulir memakai Formspree di atas sebagai cadangan.
contact_endpoint: "https://script.google.com/macros/s/AKfycbyI-efd7xbw2Kwh_KBwXTLXBczRaderCtB6Wm089EHVh1TjdHpZ4hP0WdKZyJgkwhNlxw/exec"

# Analitik ringan tanpa cookie (opsional). Daftar gratis di goatcounter.com, lalu isi kode situs di sini.
# Contoh: kalau alamat dashboard Anda https://puserve.goatcounter.com, isi dengan "puserve". Kosong = analitik mati.
goatcounter_code: ""

url: "https://puserve.github.io"
timezone: "Asia/Jakarta"

# Diperlukan karena acara "Upcoming" bertanggal masa depan.
# Berita terjadwal disembunyikan dari daftar lewat JavaScript (lihat news.html dan index.html).
future: true

plugins:
  - jekyll-sitemap

# File contoh untuk CMS tidak perlu ikut diterbitkan sebagai halaman
exclude:
  - _news/TEMPLATE.md
  - _events/TEMPLATE.md
  - _repository/TEMPLATE.md

collections:
  news:
    output: true
  events:
    output: true
  team:
    output: false
  repository:
    output: false
  voices:
    output: false

defaults:
  - scope:
      path: "admin/**/*"
    values:
      sitemap: false
  - scope:
      path: "uploads/**/*"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "news"
    values:
      layout: "news-single"
      permalink: "/news/:slug/"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event-single"
      permalink: "/events/:slug/"
