founded: '2024'
intro_en: |-
  A movement focused on environmental protection, sustainability, and social service.

  PUSERVE operates through two channels: hands-on field projects and forums for the exchange of ideas. Our mission is to educate students and the public about the environment and to collaborate with the government and local communities.
intro_id: |-
  Gerakan yang berfokus pada perlindungan lingkungan, keberlanjutan, dan pengabdian sosial.

  PUSERVE bergerak melalui dua jalur, yaitu proyek lapangan dan forum pertukaran gagasan. Misi kami mengedukasi mahasiswa dan masyarakat tentang lingkungan serta berkolaborasi dengan pemerintah dan komunitas lokal.
vision_en: |-
  Vision: To be a community that plays an active role in preserving nature and the environment by creating innovations to raise public awareness about maintaining the sustainability of ecosystems and promoting positive change for the balance of nature and the well-being of all living things.

  Mission: To educate students and the public about the environment, promote an eco-friendly lifestyle, and support biodiversity through conservation efforts. This community collaborates with local communities and the government to advance environmental policies and take action through initiatives aimed at ensuring a sustainable future.
vision_id: |-
  Visi : Menjadi komunitas yang berperan aktif dalam melestarikan alam dan lingkungan dengan menciptakan inovasi untuk meningkatkan kesadaran masyarakat dalam menjaga keberlangsungan ekosistem dan mendorong perubahan positif bagi keseimbangan alam dan kesejahteraan seluruh makhluk hidup.

  Misi: Mengedukasi mahasiswa serta masyarakat tentang lingkungan, mempromosikan gaya hidup ramah lingkungan, dan mendukung keanekaragaman hayati melalui upaya konservasi. Komunitas ini berkolaborasi dengan komunitas lokal dan pemerintah untuk memajukan kebijakan lingkungan dan mengambil tindakan dengan inisiatif untuk memastikan masa depan yang berkelanjutan.
history_en: |-
  Our journey began in 2024 under the name PRESERVE, an organization deeply rooted in President University. We were established to address complex environmental and social challenges through concrete, student-led initiatives and actionable projects. Recognizing the critical role of youth leadership, we aimed to integrate environmental advocacy with comprehensive community engagement. From the very beginning, our goal was to empower students to apply their knowledge while developing practical skills in sustainability.

  In 2025, we evolved into PUSERVE to align our identity more seamlessly with our academic institution. The transition from the prefix "Pre" to "PU" specifically reflects President University, harmonizing our movement with the wider campus ecosystem. Despite this adjustment in our name, our core abbreviation and foundational mission remain steadfastly the same. We continue to operate by prioritizing tangible, measurable outcomes over mere awareness campaigns.

  Today, we proudly operate under the umbrella of the Center for Environment, Disaster, Resilience, and Sustainability (CEDRS). This strategic affiliation provides us with the necessary legitimacy and direction to significantly expand our environmental impact. By combining on-the-ground fieldwork with thought leadership platforms, we strive to bridge the gap between environmental crises and social inequalities. Ultimately, we are committed to preparing students to become future leaders in sustainable development.
history_id: |-
  Perjalanan kami dimulai pada tahun 2024 di bawah naungan nama PRESERVE, sebuah organisasi yang berakar kuat di President University. Kami didirikan untuk mengatasi tantangan lingkungan dan sosial yang kompleks melalui inisiatif nyata dan proyek yang dipimpin oleh mahasiswa. Dengan menyadari peran penting kepemimpinan generasi muda, kami bertujuan untuk mengintegrasikan advokasi lingkungan dengan keterlibatan masyarakat. Sejak awal, tujuan kami adalah memberdayakan mahasiswa untuk menerapkan pengetahuan mereka sekaligus mengembangkan keterampilan praktis dalam membangun keberlanjutan.

  Pada tahun 2025, kami bertransformasi menjadi PUSERVE untuk menyelaraskan identitas kami secara lebih harmonis dengan institusi akademik kami. Transisi dari awalan "Pre" menjadi "PU" secara khusus merepresentasikan President University, yang mengintegrasikan pergerakan kami dengan ekosistem kampus secara menyeluruh. Meskipun terdapat penyesuaian nama ini, singkatan inti dan misi fundamental kami tetap teguh dan tidak berubah. Kami terus beroperasi dengan mengutamakan hasil yang nyata dan terukur, bukan sekadar meluncurkan kampanye kesadaran semata.

  Saat ini, kami dengan bangga beroperasi di bawah naungan Center for Environment, Disaster, Resilience, and Sustainability (CEDRS). Afiliasi strategis ini memberikan kami arahan dan legitimasi yang diperlukan untuk memperluas skala dampak lingkungan kami. Dengan menggabungkan kerja lapangan secara langsung dengan platform diskusi strategis, kami berupaya menjembatani kesenjangan antara krisis lingkungan dan ketimpangan sosial. Pada akhirnya, kami berkomitmen penuh untuk mempersiapkan mahasiswa agar menjadi pemimpin masa depan dalam sektor pembangunan berkelanjutan.
