---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team | PUSERVE</title>
    <meta property="og:title" content="Our Team | PUSERVE">
    <meta property="og:description" content="Meet the passionate minds and hands behind PUSERVE's environmental initiatives.">
    <meta property="og:image" content="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <!-- CSS TAMBAHAN ANTI GEPENG DAN BIKIN SIMETRIS -->
    <style>
        .team-grid-fixed {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px; /* Spasi antar kasta (Petinggi ke Member) */
            width: 100%;
        }
        .team-card-fixed {
            width: 260px; /* Kunci ukuran kartu biar nggak melar/mengecil */
            flex: 0 0 auto; /* Dilarang merubah ukuran sembarangan */
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    {% include navbar.html %}

    <header class="page-hero">
        <h1 data-en="Meet Our Team" data-id="Kenali Tim Kami">Meet Our Team</h1>
        <p style="font-size: 1.1rem; opacity: 0.9;" data-en="The passionate minds and hands behind PUSERVE's environmental initiatives." data-id="Para pemikir dan penggerak di balik inisiatif lingkungan PUSERVE.">The passionate minds and hands behind PUSERVE's environmental initiatives.</p>
    </header>

    <main class="container">
        <!-- ROBOT KITA BAKAL NAMBAHIN DAFTAR DIVISI DAN ORANG-ORANGNYA DI SINI OTOMATIS -->
        <div id="team-container">
            <div class="skeleton-card" style="height: 300px; align-items: center; padding-top: 40px; margin: 0 auto; width: 260px;">
                <div class="skeleton" style="width: 120px; height: 120px; border-radius: 50%;"></div>
                <div class="skeleton" style="width: 70%; height: 20px; margin-top: 20px;"></div>
                <div class="skeleton" style="width: 40%; height: 15px; margin-top: 10px;"></div>
            </div>
        </div>
    </main>

    <!-- POP-UP MODAL TEAM -->
    <div id="team-modal" class="modal-overlay">
        <div class="modal-content-box" style="text-align: center;">
            <span class="close-modal-btn" onclick="closeTeamModal()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span>
            
            <img id="modal-t-img" src="logos/LOGO_PUSERVE.png" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 0 auto 15px; border: 3px solid var(--puserve-yellow); display: block;">
            
            <h3 id="modal-t-name" style="color: var(--text-color); margin-bottom: 5px; font-size: 1.6rem; font-weight: 800;">Nama Lengkap</h3>
            <div id="modal-t-role" style="color: var(--primary-green); font-weight: 800; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase;">Jabatan - Divisi</div>
            
            <!-- DATA DENGAN FITUR COPY -->
            <div class="popup-data">
                <div class="popup-row" id="row-major">
                    <div class="p-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
                    <div class="p-label"><strong data-en="Major" data-id="Prodi">Major</strong></div>
                    <div class="p-colon">:</div>
                    <div class="p-val"><span id="modal-t-major"></span></div>
                </div>
                
                <div class="popup-row copyable" id="row-id" onclick="copyTeamData('modal-t-id', 'Student ID')" title="Click to Copy">
                    <div class="p-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div>
                    <div class="p-label"><strong data-en="Student ID" data-id="NIM">Student ID</strong></div>
                    <div class="p-colon">:</div>
                    <div class="p-val"><span id="modal-t-id"></span> <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></div>
                </div>

                <div class="popup-row copyable" id="row-email" onclick="copyTeamData('modal-t-email', 'Email')" title="Click to Copy">
                    <div class="p-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></div>
                    <div class="p-label"><strong data-en="Email" data-id="Email">Email</strong></div>
                    <div class="p-colon">:</div>
                    <div class="p-val"><span id="modal-t-email"></span> <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></div>
                </div>
            </div>
        </div>
    </div>

    {% include footer.html %}

    <script>
        let teamData = [];
        
        const divTranslations = {
            "Advisor": "Advisor",
            "Board of Director": "Dewan Direksi",
            "Secretary": "Sekretaris",
            "Treasure": "Bendahara",
            "Human Resources": "Sumber Daya Manusia",
            "General Resources": "Sumber Daya Umum",
            "Research, Observation, and Innovation": "Penelitian, Observasi, dan Inovasi",
            "Internal Public Relations": "Humas Internal",
            "External Public Relations": "Humas Eksternal",
            "Multimedia": "Multimedia",
            "Documentation": "Dokumentasi"
        };

        async function loadTeam() {
            const container = document.getElementById('team-container');
            let currentLang = localStorage.getItem('puserve_lang') || 'EN';
            const emptyMsg = currentLang === 'EN' ? 'Team data is currently being updated.' : 'Data tim sedang dalam pembaruan.';

            try {
                const res = await fetch(`https://api.github.com/repos/puserve/puserve.github.io/contents/_team`);
                if (!res.ok) throw new Error("API Error");
                const files = await res.json();
                
                for (const file of files) {
                    if (!file.name.endsWith('.md') || file.name.startsWith('TEMPLATE')) continue;
                    const mdText = await (await fetch(file.download_url)).text();
                    const parts = mdText.split('---');
                    if (parts.length >= 3) {
                        const fm = jsyaml.load(parts[1]); 
                        teamData.push(fm);
                    }
                }

                if (teamData.length === 0) { container.innerHTML = `<div class="empty-state">${emptyMsg}</div>`; return; }

                const hierarchy = { "Advisor": 1, "Chairperson": 2, "Vice Chairperson 1": 3, "Vice Chairperson 2": 4, "Head of Division": 5, "Vice Head of Division": 6, "Member": 7 };
                teamData.sort((a, b) => (hierarchy[a.position] || 99) - (hierarchy[b.position] || 99));

                const divisionsOrder = [
                    "Advisor", "Board of Director", "Secretary", "Treasure", 
                    "Human Resources", "General Resources", "Research, Observation, and Innovation", 
                    "Internal Public Relations", "External Public Relations", "Multimedia", "Documentation"
                ];

                let htmlContent = '';
                
                divisionsOrder.forEach(divName => {
                    const membersInDiv = teamData.filter(m => m.division === divName);
                    
                    if (membersInDiv.length > 0) {
                        const divTitleID = divTranslations[divName] || divName;
                        htmlContent += `<h2 class="div-title" data-en="${divName}" data-id="${divTitleID}" style="text-align: center; margin-top: 50px; margin-bottom: 25px;">${currentLang === 'EN' ? divName : divTitleID}</h2>`;
                        
                        // MESIN PEMISAH KASTA (PETINGGI vs MEMBER)
                        const leaders = membersInDiv.filter(m => m.position !== 'Member');
                        const members = membersInDiv.filter(m => m.position === 'Member');

                        // Fungsi pencetak kartu biar rapi
                        const renderCards = (group) => {
                            if (group.length === 0) return '';
                            let groupHtml = `<div class="team-grid-fixed">`;
                            group.forEach(fm => {
                                const img = fm.thumbnail ? (fm.thumbnail.includes('/') ? fm.thumbnail : `uploads/${fm.thumbnail}`) : 'logos/LOGO_PUSERVE.png';
                                const globalIndex = teamData.indexOf(fm); 
                                
                                groupHtml += `
                                    <div class="team-card team-card-fixed" onclick="openTeamModal(${globalIndex})">
                                        <img src="${img}" class="team-img" onerror="this.src='logos/LOGO_PUSERVE.png'">
                                        <h3 class="team-name">${fm.title || 'PUSERVE Member'}</h3>
                                        <span class="team-role">${fm.position || 'Member'}</span>
                                    </div>
                                `;
                            });
                            groupHtml += `</div>`;
                            return groupHtml;
                        };

                        // Cetak Lantai 1 (Petinggi) dulu, baru Lantai 2 (Member)
                        htmlContent += renderCards(leaders);
                        htmlContent += renderCards(members);
                    }
                });

                container.innerHTML = htmlContent;

            } catch (error) { 
                container.innerHTML = `<div class="empty-state">Failed to load team data. Make sure to upload members via CMS.</div>`; 
            }
        }

        function openTeamModal(index) {
            const fm = teamData[index];
            const img = fm.thumbnail ? (fm.thumbnail.includes('/') ? fm.thumbnail : `uploads/${fm.thumbnail}`) : 'logos/LOGO_PUSERVE.png';
            
            document.getElementById('modal-t-img').src = img;
            document.getElementById('modal-t-name').innerText = fm.title || '-';
            
            const roleEl = document.getElementById('modal-t-role');
            let divName = fm.division || '-';
            if (localStorage.getItem('puserve_lang') === 'ID' && divTranslations[divName]) { divName = divTranslations[divName]; }
            
            roleEl.innerText = `${fm.position || '-'} - ${divName}`;
            if(localStorage.getItem('puserve_eco') === 'true') { roleEl.style.color = 'var(--puserve-yellow)'; } 
            else { roleEl.style.color = 'var(--primary-green)'; }

            if (fm.position === "Advisor") {
                document.getElementById('row-major').style.display = 'none';
                document.getElementById('row-id').style.display = 'none';
            } else {
                document.getElementById('row-major').style.display = 'flex';
                document.getElementById('row-id').style.display = 'flex';
                document.getElementById('modal-t-major').innerText = fm.major || '-';
                document.getElementById('modal-t-id').innerText = fm.student_id || '-';
            }

            document.getElementById('modal-t-email').innerText = fm.email || '-';
            document.getElementById('team-modal').classList.add('show');
        }

        function closeTeamModal() {
            document.getElementById('team-modal').classList.remove('show');
        }

        function copyTeamData(elementId, labelName) {
            const textToCopy = document.getElementById(elementId).innerText;
            if (!textToCopy || textToCopy === '-') return;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const isID = localStorage.getItem('puserve_lang') === 'ID';
                if (typeof showToast === 'function') {
                    showToast(isID ? `${labelName} berhasil disalin!` : `${labelName} copied!`);
                } else {
                    alert(isID ? `${labelName} berhasil disalin!` : `${labelName} copied!`);
                }
            });
        }

        document.addEventListener("DOMContentLoaded", loadTeam);
        
        const langToggleCustom = document.getElementById('langToggle');
        if(langToggleCustom) {
            langToggleCustom.addEventListener('click', () => { 
                setTimeout(() => { 
                    let currentLang = localStorage.getItem('puserve_lang') || 'EN';
                    document.querySelectorAll('.div-title').forEach(el => {
                        el.innerText = currentLang === 'EN' ? el.getAttribute('data-en') : el.getAttribute('data-id');
                    });
                    document.querySelectorAll('.popup-data strong[data-en]').forEach(el => {
                        el.innerHTML = currentLang === 'EN' ? el.getAttribute('data-en') : el.getAttribute('data-id');
                    });
                }, 100); 
            });
        }
    </script>
</body>
</html>
