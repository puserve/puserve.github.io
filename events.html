<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Programs | PUSERVE</title>
    <meta property="og:title" content="Events & Programs | PUSERVE">
    <meta property="og:description" content="Discover our latest environmental actions.">
    <meta property="og:image" content="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>

    {% include navbar.html %}

    <header class="page-hero">
        <h1 data-en="EVENTS & PROGRAMS" data-id="ACARA & PROGRAM">EVENTS & PROGRAMS</h1>
        <p style="font-size: 1.1rem; opacity: 0.9;" data-en="Discover our latest environmental actions." data-id="Temukan aksi lingkungan terbaru kami.">Discover our latest environmental actions.</p>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search events..." data-en="Search events..." data-id="Cari acara...">
        </div>
    </header>

    <main class="container">
        <div class="section-header"><h2 class="section-title" data-en="Upcoming Events" data-id="Acara Mendatang">Upcoming Events</h2><div class="section-line"></div></div>
        <div id="grid-highlight" class="events-grid">
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
        </div>

        <div class="section-header"><h2 class="section-title" data-en="Past Initiatives" data-id="Inisiatif Lalu">Past Initiatives</h2><div class="section-line"></div></div>
        <div id="grid-latest" class="events-grid">
            <div class="skeleton-card"><div class="skeleton-img skeleton"></div><div class="skeleton-body"><div class="skeleton-tag skeleton"></div><div class="skeleton-title skeleton"></div><div class="skeleton-meta skeleton"></div></div></div>
        </div>
    </main>

    {% include footer.html %}

<script>
        const formatDate = (dateStr) => { try { const d = new Date(dateStr); if (!isNaN(d)) return d.toLocaleDateString(localStorage.getItem('puserve_lang') === 'EN' ? 'en-US' : 'id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); } catch(e){} return dateStr; };

        async function loadCatalog() {
            const grids = { highlight: document.getElementById('grid-highlight'), latest: document.getElementById('grid-latest') };
            let currentLang = localStorage.getItem('puserve_lang') || 'EN';
            const emptyMsg = currentLang === 'EN' ? 'No records published yet.' : 'Belum ada catatan di kategori ini.';

            try {
                // SEKARANG KITA NARIK DARI SISTEM SENDIRI, BUKAN GITHUB API! ANTI LIMIT!
                const res = await fetch(`api/events.json`);
                if (!res.ok) throw new Error("API Limit");
                const files = await res.json();
                
                let data = { highlight: [], latest: [] };
                const today = new Date();

                for (const fm of files) {
                    if(!fm.title_en) continue;
                    
                    // MESIN PENGHITUNG UMUR HARI OTOMATIS
                    const eventDate = new Date(fm.date);
                    const diffTime = Math.abs(today - eventDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                    
                    if (diffDays <= 3) {
                        data.highlight.push(fm); // 1-3 Hari masuk Highlight
                    } else {
                        data.latest.push(fm); // Sisanya masuk Past Initiatives
                    }
                }

                Object.keys(data).forEach(key => {
                    data[key].sort((a, b) => new Date(b.date) - new Date(a.date));
                    if (data[key].length === 0) { grids[key].innerHTML = `<div class="empty-state">${emptyMsg}</div>`; } 
                    else {
                        grids[key].innerHTML = data[key].map(fm => {
                            const title = currentLang === 'EN' ? (fm.title_en || fm.title) : (fm.title_id || fm.title);
                            const img = fm.thumbnail ? (fm.thumbnail.includes('/') ? fm.thumbnail : `uploads/${fm.thumbnail}`) : 'logos/LOGO_PUSERVE.png';
                            return `
                            <a href="read.html?file=${fm.fileName}" class="card trans-link">
                                <img src="${img}" class="card-img" onerror="this.src='logos/LOGO_PUSERVE.png'">
                                <div class="card-body">
                                    <span class="card-tag">${fm.status || 'Event'}</span>
                                    <h3 class="card-title">${title}</h3>
                                    <div class="card-meta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${formatDate(fm.date)}</div>
                                </div>
                            </a>`;
                        }).join('');
                    }
                });
            } catch (error) { 
                Object.values(grids).forEach(grid => { if(grid) grid.innerHTML = `<div class="empty-state" style="color:#ef4444;">Gagal memuat data dari server. Refresh halaman.</div>` }); 
            }
        }
        
        document.addEventListener("DOMContentLoaded", loadCatalog);

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const title = card.querySelector('.card-title').innerText.toLowerCase();
                card.style.display = title.includes(term) ? 'flex' : 'none';
            });
        });

        const langToggleCustom = document.getElementById('langToggle');
        if(langToggleCustom) {
            langToggleCustom.addEventListener('click', () => { setTimeout(() => { loadCatalog(); }, 100); });
        }
    </script>
</body>
</html>
