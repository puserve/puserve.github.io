<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs & Events | PUSERVE</title>
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <style>
        :root {
            --dark-green: #082619;
            --puserve-green: #11422b;
            --puserve-yellow: #fcd34d;
            --white: #ffffff;
            --gray-text: #a3b8af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--dark-green); color: var(--white); display: flex; flex-direction: column; min-height: 100vh; }

        /* NAVBAR */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: var(--dark-green); border-bottom: 1px solid #1a5c3d; }
        .nav-logos { display: flex; align-items: center; gap: 15px; }
        .nav-logos img { height: 40px; width: auto; }
        .nav-links { display: flex; align-items: center; gap: 30px; }
        .nav-links a { color: var(--white); text-decoration: none; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: var(--puserve-yellow); }
        .btn-join { background-color: var(--puserve-yellow); color: var(--dark-green); padding: 8px 20px; border-radius: 25px; font-weight: bold; }
        .btn-join:hover { background-color: #e5be3c; }

        /* HERO */
        header.hero { text-align: center; padding: 60px 20px; background: linear-gradient(180deg, var(--dark-green) 0%, var(--puserve-green) 100%); }
        .hero-title { color: var(--puserve-yellow); font-size: 3rem; margin-bottom: 10px; }
        .hero-subtitle { color: var(--gray-text); font-size: 1.2rem; }

        /* SECTION STYLING */
        main.container { flex: 1; max-width: 1200px; margin: 0 auto; padding: 40px 20px; width: 100%; }
        .section-title { color: var(--puserve-yellow); font-size: 2rem; border-bottom: 2px solid #1a5c3d; padding-bottom: 10px; margin-top: 50px; margin-bottom: 30px; }
        
        .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        /* KARTU EVENT CLICKABLE */
        .event-card { 
            background-color: var(--puserve-green); border-radius: 12px; overflow: hidden; 
            border: 1px solid #1a5c3d; display: flex; flex-direction: column; 
            text-decoration: none; color: inherit; transition: 0.3s ease; cursor: pointer;
        }
        .event-card:hover { transform: translateY(-8px); box-shadow: 0 8px 15px rgba(0,0,0,0.5); border-color: var(--puserve-yellow); }
        .event-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 2px solid var(--puserve-yellow); }
        .event-content { padding: 25px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .event-status { display: inline-block; background-color: var(--puserve-yellow); color: var(--dark-green); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; align-self: flex-start;}
        .event-title { font-size: 1.4rem; margin: 0 0 10px 0; color: var(--white); line-height: 1.3; }
        .event-meta { font-size: 0.9rem; color: var(--gray-text); }
        .read-more { margin-top: 20px; color: var(--puserve-yellow); font-weight: bold; font-size: 0.9rem; }

        footer { background-color: #051a11; text-align: center; padding: 30px 20px; color: var(--gray-text); border-top: 1px solid #1a5c3d; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logos">
            <img src="logos/LOGO_PU.png" alt="President University">
            <img src="logos/LOGO_CEDRS.png" alt="CEDRS">
            <img src="logos/LOGO_PUSERVE.png" alt="PUSERVE">
        </div>
        <div class="nav-links">
            <a href="index.html">About</a>
            <a href="events.html" style="color: var(--puserve-yellow);">Explore</a>
            <!-- Easter Egg Link Tersembunyi di pojok logo -->
            <a href="easter_egg.jpeg" target="_blank" style="color: transparent; position: absolute; top: 0; right: 0; width: 20px; height: 20px;">.</a>
            <a href="#" class="btn-join">Join Us</a>
        </div>
    </nav>

    <header class="hero">
        <h1 class="hero-title">Programs & Events</h1>
        <p class="hero-subtitle">Official Press Releases & Action Updates</p>
    </header>

    <main class="container">
        <h2 class="section-title">▶ Running Events</h2>
        <div id="grid-running" class="events-grid"><p class="gray-text">Tidak ada data.</p></div>

        <h2 class="section-title">🗓 Future Events</h2>
        <div id="grid-upcoming" class="events-grid"><p class="gray-text">Tidak ada data.</p></div>

        <h2 class="section-title">✅ Past Events</h2>
        <div id="grid-past" class="events-grid"><p class="gray-text">Tidak ada data.</p></div>
    </main>

    <footer><p>&copy; 2026 PUSERVE - President University. All Rights Reserved.</p></footer>

    <script>
        const repoName = 'puserve/puserve.github.io'; 
        const folderName = '_events';

        async function loadCatalog() {
            const gridRunning = document.getElementById('grid-running');
            const gridUpcoming = document.getElementById('grid-upcoming');
            const gridPast = document.getElementById('grid-past');

            try {
                const response = await fetch(`https://api.github.com/repos/${repoName}/contents/${folderName}`);
                const files = await response.json();

                let htmlRunning = '', htmlUpcoming = '', htmlPast = '';

                for (const file of files) {
                    if (file.name === 'TEMPLATE-EVENT.md' || !file.name.endsWith('.md')) continue;

                    const mdResponse = await fetch(file.download_url);
                    const mdText = await mdResponse.text();
                    const parts = mdText.split('---');
                    
                    if (parts.length >= 3) {
                        const fm = jsyaml.load(parts[1]);
                        
                     let img = fm.thumbnail ? (fm.thumbnail.startsWith('http') ? fm.thumbnail : (fm.thumbnail.includes('/') ? fm.thumbnail : `uploads/${fm.thumbnail}`)) : 'https://via.placeholder.com/400x200?text=No+Image';

                        // Arahkan klik ke halaman pembaca (read.html)
                        const cardHTML = `
                            <a href="read.html?file=${file.name}" class="event-card">
                                <img src="${img}" class="event-img" alt="Thumbnail" onerror="this.src='https://via.placeholder.com/400x200?text=PUSERVE'">
                                <div class="event-content">
                                    <div>
                                        <span class="event-status">${fm.status || 'TBA'}</span>
                                        <h2 class="event-title">${fm.title}</h2>
                                        <div class="event-meta">📅 ${fm.date} <br> 👥 ${fm.attendees}</div>
                                    </div>
                                    <div class="read-more">Read Press Release →</div>
                                </div>
                            </a>
                        `;

                        const status = (fm.status || '').toLowerCase();
                        if (status === 'running') htmlRunning += cardHTML;
                        else if (status === 'upcoming' || status === 'future') htmlUpcoming += cardHTML;
                        else htmlPast += cardHTML;
                    }
                }

                if (htmlRunning) gridRunning.innerHTML = htmlRunning;
                if (htmlUpcoming) gridUpcoming.innerHTML = htmlUpcoming;
                if (htmlPast) gridPast.innerHTML = htmlPast;

            } catch (error) {
                console.error("Error:", error);
            }
        }
        loadCatalog();
    </script>
</body>
</html>
