<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | PUSERVE</title>
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>

    {% include navbar.html %}
    <div id="reading-progress"></div>

    <main>
        <div class="paper">
            <a href="events.html" class="back-link trans-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> <span data-en="Back to Events" data-id="Kembali ke Acara">Back to Events</span></a>
            <div id="pr-content"><h2 style="text-align:center; color:var(--text-muted);" data-en="Loading document..." data-id="Memuat dokumen...">Loading document...</h2></div>
        </div>
    </main>

    {% include footer.html %}

    <script>
        function copyLink() { navigator.clipboard.writeText(window.location.href).then(() => { showToast(localStorage.getItem('puserve_lang') === 'EN' ? "Link copied!" : "Tautan disalin!"); }); }
        
        async function loadPressRelease() {
            const params = new URLSearchParams(window.location.search);
            const fileName = params.get('file');
            let currentLang = localStorage.getItem('puserve_lang') || 'EN';
            const contentDiv = document.getElementById('pr-content');
            if (!fileName) { contentDiv.innerHTML = `<h2 style='color:var(--puserve-yellow); text-align:center;'>${currentLang==='EN'?'Error: Document not found.':'Dokumen tidak ditemukan.'}</h2>`; return; }

            try {
                const response = await fetch(`https://raw.githubusercontent.com/puserve/puserve.github.io/main/_events/${fileName}`);
                if (!response.ok) throw new Error("Gagal");

                const mdText = await response.text();
                const parts = mdText.split('---');

                if (parts.length >= 3) {
                    const fm = jsyaml.load(parts[1]);
                    const bodyHTML = marked.parse(parts.slice(2).join('---'));
                    const wordCount = bodyHTML.replace(/<[^>]*>?/gm, '').split(/\s+/).length;
                    const readingTime = Math.max(1, Math.ceil(wordCount / 200));

                    const getImgUrl = (img) => { if (!img) return ''; if (img.startsWith('http') || img.includes('/')) return img; return `uploads/${img}`; };
                    const img1 = getImgUrl(fm.thumbnail); const img2 = getImgUrl(fm.image_2); const img3 = getImgUrl(fm.image_3);

                    let cleanDate = fm.date;
                    try { const d = new Date(fm.date); if (!isNaN(d)) cleanDate = d.toLocaleDateString(currentLang === 'EN'?'en-US':'id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); } catch(e){}

                    let html = `
                        <div class="pr-header">
                            <div class="pr-tag">OFFICIAL EVENTS & PROGRAMS REPORT</div>
                            <h1 class="pr-title">${fm.title}</h1>
                            <div class="pr-meta">
                                <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--puserve-yellow)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> Jakarta, ID</span>
                                <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--puserve-yellow)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${cleanDate}</span>
                                <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--puserve-yellow)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> ${fm.attendees || '-'}</span>
                                <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--puserve-yellow)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${readingTime} min read</span>
                            </div>
                        </div>
                    `;

                    if (img1) html += `<img src="${img1}" class="hero-img" alt="Thumbnail" onerror="this.style.display='none'">`;
                    html += `<div class="pr-body">${bodyHTML}</div>`;

                    if (img2 || img3) {
                        html += `<div class="body-images">`;
                        if (img2) html += `<img src="${img2}" alt="Dokumentasi 1" onerror="this.style.display='none'">`;
                        if (img3) html += `<img src="${img3}" alt="Dokumentasi 2" onerror="this.style.display='none'">`;
                        html += `</div>`;
                    }

                    if (fm.outcome) { html += `<div class="outcome-box"><div class="outcome-title">OUTCOME</div><div class="outcome-text">"${fm.outcome}"</div></div>`; }

                    const currentUrl = encodeURIComponent(window.location.href);
                    html += `
                        <div class="share-box">
                            <span class="share-title">${currentLang==='EN'?'Share this event:':'Bagikan acara ini:'}</span>
                            <div class="share-buttons">
                                <a href="https://wa.me/?text=${currentUrl}" target="_blank" class="share-btn wa-btn">WhatsApp</a>
                                <button onclick="copyLink()" class="share-btn copy-btn">Copy Link</button>
                            </div>
                        </div>
                    `;
                    contentDiv.innerHTML = html;
                    
                    window.addEventListener('scroll', () => {
                        let st = window.pageYOffset || document.documentElement.scrollTop;
                        let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                        document.getElementById("reading-progress").style.width = ((st / height) * 100) + "%";
                    });
                }
            } catch (error) { contentDiv.innerHTML = `<h2 style='color:var(--text-muted); text-align:center;'>${currentLang==='EN'?'Failed to load document.':'Gagal memuat dokumen.'}</h2>`; }
        }
        document.addEventListener("DOMContentLoaded", loadPressRelease);
    </script>
</body>
</html>
