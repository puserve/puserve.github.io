<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Release | PUSERVE</title>
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <style>
        :root { --dark-green: #082619; --puserve-green: #11422b; --puserve-yellow: #fcd34d; --gray-text: #a3b8af; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--dark-green); display: flex; flex-direction: column; min-height: 100vh; }

        /* NAVBAR SAMA DENGAN EVENTS */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: var(--dark-green); border-bottom: 1px solid #1a5c3d; }
        .nav-logos { display: flex; align-items: center; gap: 15px; }
        .nav-logos img { height: 40px; width: auto; }
        .nav-links { display: flex; align-items: center; gap: 30px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .btn-join { background-color: var(--puserve-yellow); color: var(--dark-green); padding: 8px 20px; border-radius: 25px; font-weight: bold; }

        /* PRESS RELEASE PAPER STYLING */
        main { flex: 1; padding: 50px 20px; display: flex; justify-content: center; }
        .paper { background-color: #ffffff; color: #333333; max-width: 800px; width: 100%; border-radius: 8px; padding: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* HEADER RILIS */
        .pr-header { text-align: center; border-bottom: 2px solid var(--puserve-green); padding-bottom: 20px; margin-bottom: 30px; }
        .pr-tag { color: var(--puserve-green); font-weight: bold; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; }
        .pr-title { font-size: 2.5rem; color: #111; margin: 15px 0; font-family: 'Georgia', serif; line-height: 1.2; }
        .pr-meta { color: #666; font-size: 0.95rem; }

        /* IMAGES STYLING */
        .hero-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 6px; margin-bottom: 30px; }
        .body-images { display: flex; gap: 20px; margin: 30px 0; }
        .body-images img { flex: 1; width: 50%; max-height: 300px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }

        /* ARTIKEL */
        .pr-body { font-size: 1.1rem; line-height: 1.8; color: #222; font-family: 'Georgia', serif; }
        .pr-body h1, .pr-body h2, .pr-body h3 { font-family: 'Segoe UI', sans-serif; color: var(--puserve-green); margin-top: 30px; }
        
        /* OUTCOME BOX */
        .outcome-box { background-color: #f4f8f6; border-left: 5px solid var(--puserve-green); padding: 25px; margin-top: 40px; border-radius: 0 6px 6px 0; }
        .outcome-title { color: var(--puserve-green); font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; font-family: 'Segoe UI', sans-serif; }
        .outcome-text { font-size: 1.05rem; font-style: italic; color: #444; }

        .back-link { display: inline-block; margin-bottom: 20px; color: var(--puserve-yellow); text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }

        footer { background-color: #051a11; text-align: center; padding: 30px 20px; color: var(--gray-text); border-top: 1px solid #1a5c3d; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logos">
            <img src="logos/LOGO_PU.png" alt="President University">
            <img src="logos/LOGO_CEDRS.png" alt="CEDRS">
            <img src="logos/LOGO_PUSERVE.png" alt="PUSERVE">
        </div>
        <div class="nav-links">
            <a href="index.html">About</a>
            <a href="events.html" style="color: var(--puserve-yellow);">Explore</a>
            <a href="easter_egg.jpeg" target="_blank" style="color: transparent; position: absolute; top: 0; right: 0; width: 20px; height: 20px;">.</a>
            <a href="#" class="btn-join">Join Us</a>
        </div>
    </nav>

    <main>
        <div class="paper">
            <a href="events.html" class="back-link">← Kembali ke Events</a>
            
            <div id="pr-content">
                <h2 style="text-align:center; color:#888;">Memuat Dokumen...</h2>
            </div>
        </div>
    </main>

    <footer><p>&copy; 2026 PUSERVE - President University. All Rights Reserved.</p></footer>

    <script>
        const repoName = 'puserve/puserve.github.io'; 
        
        // Mengambil nama file dari URL (contoh: read.html?file=2026-event.md)
        const params = new URLSearchParams(window.location.search);
        const fileName = params.get('file');

        async function loadPressRelease() {
            const contentDiv = document.getElementById('pr-content');

            if (!fileName) {
                contentDiv.innerHTML = "<h2 style='color:red;'>Error: Dokumen tidak ditemukan.</h2>";
                return;
            }

            try {
                const response = await fetch(`https://raw.githubusercontent.com/${repoName}/main/_events/${fileName}`);
                if (!response.ok) throw new Error("Gagal mengambil data");
                
                const mdText = await response.text();
                const parts = mdText.split('---');
                
                if (parts.length >= 3) {
                    const fm = jsyaml.load(parts[1]);
                    const bodyHTML = marked.parse(parts.slice(2).join('---'));

                    // Siapkan gambar
                    const getImgUrl = (img) => img ? (img.startsWith('http') ? img : `uploads/${img}`) : '';
                    const img1 = getImgUrl(fm.thumbnail);
                    const img2 = getImgUrl(fm.image_2);
                    const img3 = getImgUrl(fm.image_3);

                    // Susun Layout Kertas
                    let html = `
                        <div class="pr-header">
                            <div class="pr-tag">OFFICIAL PRESS RELEASE</div>
                            <h1 class="pr-title">${fm.title}</h1>
                            <div class="pr-meta"><b>Jakarta, ID</b> | Tanggal: ${fm.date} | Kehadiran: ${fm.attendees || '-'}</div>
                        </div>
                    `;

                    if (img1) html += `<img src="${img1}" class="hero-img" alt="Thumbnail Utama" onerror="this.style.display='none'">`;
                    
                    html += `<div class="pr-body">${bodyHTML}</div>`;

                    // Jika ada gambar 2 dan 3, tampilkan bersampingan
                    if (img2 || img3) {
                        html += `<div class="body-images">`;
                        if (img2) html += `<img src="${img2}" alt="Dokumentasi 1" onerror="this.style.display='none'">`;
                        if (img3) html += `<img src="${img3}" alt="Dokumentasi 2" onerror="this.style.display='none'">`;
                        html += `</div>`;
                    }

                    // Tambahkan Kotak Outcome di akhir
                    if (fm.outcome) {
                        html += `
                            <div class="outcome-box">
                                <div class="outcome-title">✅ Hasil Akhir (Outcome)</div>
                                <div class="outcome-text">"${fm.outcome}"</div>
                            </div>
                        `;
                    }

                    contentDiv.innerHTML = html;
                }
            } catch (error) {
                contentDiv.innerHTML = `<h2 style='color:red;'>Gagal memuat rilis pers. Periksa koneksi atau file.</h2>`;
            }
        }
        
        loadPressRelease();
    </script>
</body>
</html>
