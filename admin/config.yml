backend:
  name: github
  repo: puserve/puserve.github.io
  branch: main

media_folder: "uploads"
public_folder: "uploads"

collections:
  - name: "news"
    label: "PUSERVE Outlook (Berita)"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Judul (English)", name: "title_en", widget: "string"}
      - {label: "Judul (Indonesia)", name: "title_id", widget: "string"}
      - {label: "Tanggal Terbit", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Kategori Berita", name: "category", widget: "select", options: ["Highlight", "Latest News", "Archive"]}
      - {label: "Penulis", name: "author", widget: "string", default: "PUSERVE Editorial"}
      - {label: "Foto Utama (Thumbnail)", name: "thumbnail", widget: "image", required: false}
      - {label: "Kutipan Penting (Key Quote)", name: "quote", widget: "string", required: false}
      - {label: "Foto Tambahan 1 (Opsional)", name: "image_2", widget: "image", required: false}
      - {label: "Foto Tambahan 2 (Opsional)", name: "image_3", widget: "image", required: false}
      - {label: "Isi Berita (Gunakan ===ID=== sbg pemisah bahasa)", name: "body", widget: "markdown"}

  - name: "events"
    label: "Events & Programs (Acara)"
    folder: "_events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Nama Acara (English)", name: "title_en", widget: "string"}
      - {label: "Nama Acara (Indonesia)", name: "title_id", widget: "string"}
      - {label: "Tanggal Acara", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Kategori Acara", name: "category", widget: "select", options: ["Upcoming", "Past Initiatives"]}
      - {label: "Status", name: "status", widget: "string", default: "Program"}
      - {label: "Jumlah Peserta", name: "attendees", widget: "string", default: "200+ Participants"}
      - {label: "Foto Utama (Thumbnail)", name: "thumbnail", widget: "image", required: false}
      - {label: "Hasil/Dampak Acara (Outcome)", name: "outcome", widget: "string", required: false}
      - {label: "Foto Tambahan 1 (Opsional)", name: "image_2", widget: "image", required: false}
      - {label: "Foto Tambahan 2 (Opsional)", name: "image_3", widget: "image", required: false}
      - {label: "Isi Laporan (Gunakan ===ID=== sbg pemisah bahasa)", name: "body", widget: "markdown"}

  - name: "team"
    label: "Team Members (Pengurus)"
    folder: "_team"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - {label: "Nama Lengkap", name: "title", widget: "string"}
      - {label: "Foto Profil", name: "thumbnail", widget: "image"}
      - {label: "Jabatan", name: "position", widget: "select", options: ["Advisor", "Chairperson", "Vice Chairperson 1", "Vice Chairperson 2", "Head of Division", "Vice Head of Division", "Member"]}
      - {label: "Divisi", name: "division", widget: "select", options: ["Advisor", "Board of Director", "Secretary", "Treasure", "Human Resources", "General Resources", "Research, Observation, and Innovation", "Internal Public Relations", "External Public Relations", "Multimedia", "Documentation"]}
      - {label: "Program Studi (Major)", name: "major", widget: "string", required: false}
      - {label: "Student ID", name: "student_id", widget: "string", required: false}
      - {label: "Email Campus", name: "email", widget: "string"}

  - name: "repository"
    label: "Public Repository (Dokumen)"
    folder: "_repository"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Judul Dokumen (English)", name: "title_en", widget: "string"}
      - {label: "Judul Dokumen (Indonesia)", name: "title_id", widget: "string"}
      - {label: "Tanggal Update", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Kategori / Label", name: "category", widget: "string", hint: "Ketik kategori baru atau yang sudah ada (misal: Legal & Ethics, Guidelines & SOPs). Ini akan otomatis jadi tombol filter di web."}
      - {label: "Format File", name: "format", widget: "select", options: ["PDF", "ZIP", "DOCX", "XLSX", "PPTX", "IMAGE"]}
      - {label: "Ukuran File (Contoh: 1.2 MB)", name: "size", widget: "string"}
      - {label: "Upload File Dokumen", name: "file_url", widget: "file"}
      - {label: "Isi Dokumen (Hanya untuk fitur Baca Pop-up)", name: "body", widget: "markdown", required: false, hint: "Isi teks dokumen di sini jika ingin fitur Pop-up Baca. Gunakan ===ID=== sebagai pemisah bahasa EN/ID."}
