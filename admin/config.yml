backend:
  name: github
  repo: puserve/puserve.github.io
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

# OPSIONAL (nonaktif): pengecil foto otomatis saat unggah dari Sveltia.
# Aktifkan dengan menghapus tanda "#" di baris-baris di bawah, lalu COBA unggah 1 foto dulu.
# Catatan: sebagian sumber menyebut foto lama berformat lain bisa tampil kosong di editor CMS
# setelah opsi ini aktif (di situs tetap normal). Kalau terjadi, beri tanda "#" lagi.
# media_libraries:
#   default:
#     config:
#       max_file_size: 10485760   # 10 MB
#       transformations:
#         raster_image:
#           format: webp
#           quality: 85
#           width: 1600
#           height: 1600

collections:
  - name: "news"
    label: "PUSERVE Outlook (Berita)"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Judul (English)", name: "title_en", widget: "string"}
      - {label: "Judul (Indonesia)", name: "title_id", widget: "string"}
      - {label: "Deskripsi Singkat (kartu preview WhatsApp - EN)", name: "desc_en", widget: "string", required: false, hint: "Hanya muncul di kartu preview saat link dibagikan, tidak tampil di artikel."}
      - {label: "Deskripsi Singkat (kartu preview WhatsApp - ID)", name: "desc_id", widget: "string", required: false, hint: "Hanya muncul di kartu preview saat link dibagikan, tidak tampil di artikel."}
      - {label: "Jadwal Publish", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Waktu Jakarta (WIB). Berita baru muncul di daftar setelah waktu ini. Halaman artikelnya tetap bisa dibuka lewat link langsung."}
      - label: "Penulis"
        name: "author"
        widget: "select"
        options:
          - {label: "PUSERVE Editorial Board", value: "PUSERVE Editorial Board"}
          - {label: "Noel Jacob Ottley", value: "Noel Jacob Ottley"}
          - {label: "Muh. Ahsan I.S. Zulni", value: "Muh. Ahsan I.S. Zulni"}
          - {label: "Aurelia C.P. Kaparang", value: "Aurelia C.P. Kaparang"}
          - {label: "Beatrix K.P. Madeline", value: "Beatrix K.P. Madeline"}
          - {label: "Muhammad H.F. Adzhim", value: "Muhammad H.F. Adzhim"}
        default: "PUSERVE Editorial Board"
      - {label: "Lokasi", name: "location", widget: "string", required: false, default: "Jakarta, ID"}
      - {label: "Foto Utama (Thumbnail)", name: "thumbnail", widget: "image", required: false}
      - {label: "Kutipan Penting (Key Quote - English)", name: "quote_en", widget: "string", required: false}
      - {label: "Kutipan Penting (Key Quote - Indonesia)", name: "quote_id", widget: "string", required: false}
      - {label: "Isi Berita (Tulis ===ID=== di baris sendiri sbg pemisah bahasa, JANGAN di-bold)", name: "body", widget: "markdown"}

  - name: "events"
    label: "Events & Programs (Acara)"
    folder: "_events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Nama Acara (English)", name: "title_en", widget: "string"}
      - {label: "Nama Acara (Indonesia)", name: "title_id", widget: "string"}
      - {label: "Deskripsi Singkat (kartu preview WhatsApp - EN)", name: "desc_en", widget: "string", required: false, hint: "Hanya muncul di kartu preview saat link dibagikan, tidak tampil di artikel."}
      - {label: "Deskripsi Singkat (kartu preview WhatsApp - ID)", name: "desc_id", widget: "string", required: false, hint: "Hanya muncul di kartu preview saat link dibagikan, tidak tampil di artikel."}
      - {label: "Tanggal & Jam Acara", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Jam 00:00 dianggap acara seharian penuh di tombol kalender."}
      - {label: "Tanggal & Jam Selesai (opsional)", name: "end_date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm", required: false, hint: "Dipakai tombol Tambah ke Kalender. Kosong = berdurasi 2 jam (atau 1 hari kalau jamnya 00:00)."}
      - {label: "Lokasi Acara", name: "location", widget: "string", required: false, default: "President University, Cikarang"}
      - {label: "Status", name: "status", widget: "select", options: ["Running", "Upcoming", "Archived"], default: "Upcoming"}
      - {label: "Jumlah Peserta", name: "attendees", widget: "string", required: false, default: "200+ Participants", hint: "Isi '-' atau kosongkan kalau tidak ingin ditampilkan."}
      - {label: "Buka pendaftaran peserta (RSVP)", name: "rsvp_open", widget: "boolean", default: false, hint: "Aktif = muncul formulir Daftar di halaman acara (hanya untuk acara yang belum selesai). Perlu Apps Script aktif."}
      - {label: "Kuota peserta", name: "rsvp_capacity", widget: "number", value_type: "int", min: 0, default: 0, required: false, hint: "0 = tanpa batas. Kalau terisi, pendaftaran otomatis ditutup saat kuota penuh."}
      - {label: "Foto Utama (Thumbnail)", name: "thumbnail", widget: "image", required: false}
      - {label: "Galeri Foto (bisa pilih banyak sekaligus)", name: "gallery", widget: "image", multiple: true, required: false, hint: "Foto dokumentasi acara. Tampil sebagai galeri dengan pembesar foto di halaman acara. Idealnya lebar maksimal 1600 px dan di bawah 500 KB per foto."}
      - {label: "Hasil/Dampak Acara (Outcome - English)", name: "outcome_en", widget: "string", required: false}
      - {label: "Hasil/Dampak Acara (Outcome - Indonesia)", name: "outcome_id", widget: "string", required: false}
      - label: "Penulis Laporan"
        name: "author"
        widget: "select"
        options:
          - {label: "PUSERVE Editorial Board", value: "PUSERVE Editorial Board"}
          - {label: "Noel Jacob Ottley", value: "Noel Jacob Ottley"}
          - {label: "Muh. Ahsan I.S. Zulni", value: "Muh. Ahsan I.S. Zulni"}
          - {label: "Aurelia C.P. Kaparang", value: "Aurelia C.P. Kaparang"}
          - {label: "Beatrix K.P. Madeline", value: "Beatrix K.P. Madeline"}
          - {label: "Muhammad H.F. Adzhim", value: "Muhammad H.F. Adzhim"}
        default: "PUSERVE Editorial Board"
      - {label: "Isi Laporan (Tulis ===ID=== di baris sendiri sbg pemisah bahasa, JANGAN di-bold)", name: "body", widget: "markdown"}

  - name: "team"
    label: "Team Members (Pengurus)"
    folder: "_team"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - {label: "Nama Lengkap", name: "title", widget: "string"}
      - {label: "Foto Profil", name: "thumbnail", widget: "image"}
      - {label: "Jabatan", name: "position", widget: "select", options: ["Advisor", "Chairperson", "Vice Chairperson 1", "Vice Chairperson 2", "Head of Division", "Vice Head of Division", "Member"]}
      - {label: "Divisi", name: "division", widget: "select", options: ["Advisor", "Board of Director", "Secretary", "Treasure", "Human Resources", "General Resources", "Research, Observation, and Innovation", "Internal Public Relations", "External Public Relations", "Multimedia", "Documentation"]}
      - {label: "Program Studi (Major)", name: "major", widget: "string", required: false}
      - {label: "Student ID", name: "student_id", widget: "string", required: false}
      - {label: "Email Campus", name: "email", widget: "string"}

  - name: "repository"
    label: "Public Repository (Dokumen)"
    folder: "_repository"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Judul Dokumen (English)", name: "title_en", widget: "string"}
      - {label: "Judul Dokumen (Indonesia)", name: "title_id", widget: "string"}
      - {label: "Tanggal Update", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Kategori / Label", name: "category", widget: "string", hint: "Ketik kategori baru atau yang sudah ada (misal: Legal & Ethics, Guidelines & SOPs). Ini akan otomatis jadi tombol filter di web."}
      - {label: "Format File", name: "format", widget: "select", options: ["PDF", "ZIP", "DOCX", "XLSX", "PPTX", "IMAGE"]}
      - {label: "Ukuran File (Contoh: 1.2 MB)", name: "size", widget: "string"}
      - {label: "Upload File Dokumen", name: "file_url", widget: "file"}

  - name: "settings"
    label: "Web Settings & Stats"
    files:
      - label: "Impact & Live Campaigns"
        name: "stats"
        file: "_data/stats.yml"
        fields:
          - label: "ANGKA DAMPAK (IMPACT STATS)"
            name: "impact"
            widget: "object"
            fields:
              - {label: "Jumlah Eco-Warriors", name: "warriors", widget: "number", hint: "Angka 0 = bagian ini disembunyikan di web."}
              - {label: "Jumlah Kampanye", name: "campaigns", widget: "number", hint: "Angka 0 = bagian ini disembunyikan di web."}
              - {label: "Jumlah Mitra/Partner", name: "partners", widget: "number", hint: "Angka 0 = bagian ini disembunyikan di web."}
              - {label: "Data diperbarui per", name: "updated", widget: "string", required: false, hint: "Teks bebas, contoh: 3 November 2026. Tampil di bawah angka dampak."}
          - label: "KAMPANYE BERJALAN (LIVE CAMPAIGNS)"
            name: "campaigns"
            widget: "list"
            summary: "{{fields.title_en}} - {{fields.percentage}}%"
            fields:
              - {label: "Judul Kampanye (EN)", name: "title_en", widget: "string"}
              - {label: "Judul Kampanye (ID)", name: "title_id", widget: "string"}
              - {label: "Teks Target (EN)", name: "target_en", widget: "string"}
              - {label: "Teks Target (ID)", name: "target_id", widget: "string"}
              - {label: "Persentase Progress (0-100)", name: "percentage", widget: "number", min: 0, max: 100, hint: "Angka 0 ditampilkan sebagai 'Baru'."}
              - {label: "Warna Progress Bar (Hex Code)", name: "color", widget: "string", default: "#10b981", hint: "Contoh: Hijau #10b981, Biru #3b82f6, Kuning #fcd34d"}
              - {label: "Status Saat Ini (EN)", name: "current_en", widget: "string", hint: "Contoh: 750 / 1,000 trees planted"}
              - {label: "Status Saat Ini (ID)", name: "current_id", widget: "string", hint: "Contoh: 750 / 1.000 pohon ditanam"}

      - label: "Halaman Tentang (About)"
        name: "about"
        file: "_data/about.yml"
        fields:
          - {label: "Tahun berdiri", name: "founded", widget: "string", required: false}
          - {label: "Siapa kami (English)", name: "intro_en", widget: "markdown", required: false}
          - {label: "Siapa kami (Indonesia)", name: "intro_id", widget: "markdown", required: false}
          - {label: "Visi & misi (English)", name: "vision_en", widget: "markdown", required: false}
          - {label: "Visi & misi (Indonesia)", name: "vision_id", widget: "markdown", required: false}
          - {label: "Perjalanan / sejarah (English)", name: "history_en", widget: "markdown", required: false}
          - {label: "Perjalanan / sejarah (Indonesia)", name: "history_id", widget: "markdown", required: false}
          - label: "Struktur divisi"
            name: "divisions"
            widget: "list"
            required: false
            summary: "{{fields.name_en}}"
            fields:
              - {label: "Divisi di data Team (harus cocok)", name: "match", widget: "select", options: ["Advisor", "Board of Director", "Secretary", "Treasure", "Human Resources", "General Resources", "Research, Observation, and Innovation", "Internal Public Relations", "External Public Relations", "Multimedia", "Documentation"]}
              - {label: "Nama tampil (EN)", name: "name_en", widget: "string"}
              - {label: "Nama tampil (ID)", name: "name_id", widget: "string"}
              - {label: "Tugas divisi (EN)", name: "desc_en", widget: "text", required: false}
              - {label: "Tugas divisi (ID)", name: "desc_id", widget: "text", required: false}
          - label: "Afiliasi"
            name: "affiliations"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - {label: "Nama lembaga", name: "name", widget: "string"}
              - {label: "Logo", name: "logo", widget: "image", required: false}
              - {label: "Tautan situs (opsional)", name: "url", widget: "string", required: false}
              - {label: "Keterangan (EN)", name: "desc_en", widget: "text", required: false}
              - {label: "Keterangan (ID)", name: "desc_id", widget: "text", required: false}
          - label: "Mitra"
            name: "partners"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - {label: "Nama mitra", name: "name", widget: "string"}
              - {label: "Logo (opsional)", name: "logo", widget: "image", required: false}
              - {label: "Tautan situs (opsional)", name: "url", widget: "string", required: false}
      - label: "Halaman Cara Bergabung"
        name: "join"
        file: "_data/join.yml"
        fields:
          - {label: "Status pendaftaran", name: "recruitment_status", widget: "select", required: false, options: [{label: "Dibuka", value: "open"}, {label: "Segera dibuka", value: "soon"}, {label: "Ditutup", value: "closed"}], hint: "Kosongkan untuk menyembunyikan banner status."}
          - {label: "Periode pendaftaran (EN)", name: "period_en", widget: "string", required: false, hint: "Contoh: 1 - 15 February 2027"}
          - {label: "Periode pendaftaran (ID)", name: "period_id", widget: "string", required: false, hint: "Contoh: 1 - 15 Februari 2027"}
          - {label: "Pengantar (English)", name: "intro_en", widget: "markdown", required: false}
          - {label: "Pengantar (Indonesia)", name: "intro_id", widget: "markdown", required: false}
          - label: "Persyaratan"
            name: "requirements"
            widget: "list"
            required: false
            summary: "{{fields.text_en}}"
            fields:
              - {label: "Persyaratan (EN)", name: "text_en", widget: "string"}
              - {label: "Persyaratan (ID)", name: "text_id", widget: "string"}
          - label: "Alur pendaftaran"
            name: "steps"
            widget: "list"
            required: false
            summary: "{{fields.title_en}}"
            fields:
              - {label: "Judul langkah (EN)", name: "title_en", widget: "string"}
              - {label: "Judul langkah (ID)", name: "title_id", widget: "string"}
              - {label: "Penjelasan (EN)", name: "text_en", widget: "text", required: false}
              - {label: "Penjelasan (ID)", name: "text_id", widget: "text", required: false}
          - label: "Pertanyaan yang sering diajukan (FAQ)"
            name: "faqs"
            widget: "list"
            required: false
            summary: "{{fields.q_en}}"
            fields:
              - {label: "Pertanyaan (EN)", name: "q_en", widget: "string"}
              - {label: "Pertanyaan (ID)", name: "q_id", widget: "string"}
              - {label: "Jawaban (EN)", name: "a_en", widget: "markdown"}
              - {label: "Jawaban (ID)", name: "a_id", widget: "markdown"}

  - name: "voices"
    label: "Voices of Impact (Kutipan)"
    folder: "_voices"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Nama Tokoh", name: "title", widget: "string", hint: "Contoh: Noel Jacob Ottley"}
      - {label: "Jabatan (English)", name: "role_en", widget: "string", hint: "Contoh: Vice Chairperson II (External) of PUSERVE"}
      - {label: "Jabatan (Indonesia)", name: "role_id", widget: "string", hint: "Contoh: Wakil Ketua II (Eksternal) PUSERVE"}
      - {label: "Logo Instansi (Opsional)", name: "logo", widget: "image", required: false, hint: "Upload logo KLH, partner, dll. Kosongkan jika ingin otomatis pakai logo PUSERVE."}
      - {label: "Kutipan (English)", name: "quote_en", widget: "text"}
      - {label: "Kutipan (Indonesia)", name: "quote_id", widget: "text"}
      - {label: "Tanggal Dibuat", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
