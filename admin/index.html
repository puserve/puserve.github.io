<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUSERVE | Admin Dashboard</title>
    <link rel="icon" type="image/png" href="../logos/LOGO_PUSERVE.png">
  </head>
  <body>
    <!-- MESIN UTAMA SVELTIA CMS -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- OTAK TAMBAHAN BUAT LIVE PREVIEW DESAIN -->
    <script>
      // 1. Suntikin file CSS utama PUSERVE ke dalam layar admin
      CMS.registerPreviewStyle("../style.css");

      // 2. Bikin cetakan desain (Template) khusus buat NEWS / OUTLOOK
      var NewsPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          // Narik data yang lagi diketik di sebelah kiri
          var title = entry.getIn(['data', 'title_en']) || entry.getIn(['data', 'title_id']) || 'Ketik Judul Berita...';
          var date = entry.getIn(['data', 'date']) || 'Pilih Tanggal';
          var author = entry.getIn(['data', 'author']) || 'PUSERVE Editorial';
          var image = entry.getIn(['data', 'thumbnail']);
          var body = this.props.widgetFor('body'); // Narik hasil ketikan isi beritanya
          
          // Ngerender gambar kalau udah diupload
          var imgHtml = image ? h('img', {src: this.props.getAsset(image).toString(), style: {width: '100%', borderRadius: '16px', marginBottom: '20px', objectFit: 'cover', maxHeight: '400px'}}) : '';

          // Ngerakit tampilan pakai HTML yang disuntik CSS
          return h('div', {className: 'container', style: {padding: '40px 20px', backgroundColor: 'var(--bg-color)', color: 'var(--text-color)', minHeight: '100vh'}},
            h('div', {className: 'article-header', style: {marginBottom: '30px'}},
              h('h1', {style: {fontSize: '2.5rem', color: 'var(--primary-green)', fontWeight: '900', marginBottom: '10px'}}, title),
              h('div', {style: {color: 'var(--text-muted)', fontWeight: '600'}}, "📅 " + date + "   |   ✍️ " + author)
            ),
            imgHtml,
            h('div', {className: 'article-content', style: {lineHeight: '1.8', fontSize: '1.1rem'}}, body)
          );
        }
      });

      // 3. Bikin cetakan desain khusus buat EVENTS
      var EventPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title_en']) || entry.getIn(['data', 'title_id']) || 'Ketik Nama Acara...';
          var date = entry.getIn(['data', 'date']) || 'Pilih Tanggal';
          var status = entry.getIn(['data', 'status']) || 'Program';
          var attendees = entry.getIn(['data', 'attendees']) || 'Jumlah Peserta';
          var image = entry.getIn(['data', 'thumbnail']);
          var body = this.props.widgetFor('body');
          
          var imgHtml = image ? h('img', {src: this.props.getAsset(image).toString(), style: {width: '100%', borderRadius: '16px', marginBottom: '20px', objectFit: 'cover', maxHeight: '400px'}}) : '';

          return h('div', {className: 'container', style: {padding: '40px 20px', backgroundColor: 'var(--bg-color)', color: 'var(--text-color)', minHeight: '100vh'}},
            h('div', {className: 'article-header', style: {marginBottom: '30px'}},
              h('span', {style: {background: 'var(--puserve-yellow)', color: 'var(--dark-green)', padding: '5px 15px', borderRadius: '20px', fontWeight: '800', fontSize: '0.9rem'}}, status),
              h('h1', {style: {fontSize: '2.5rem', color: 'var(--primary-green)', fontWeight: '900', marginTop: '15px', marginBottom: '10px'}}, title),
              h('div', {style: {color: 'var(--text-muted)', fontWeight: '600'}}, "📅 " + date + "   |   👥 " + attendees)
            ),
            imgHtml,
            h('div', {className: 'article-content', style: {lineHeight: '1.8', fontSize: '1.1rem'}}, body)
          );
        }
      });

      // 4. Daftarin cetakan ini ke mesin Sveltia
      CMS.registerPreviewTemplate("news", NewsPreview);
      CMS.registerPreviewTemplate("events", EventPreview);
    </script>
  </body>
</html>
