<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook Article | PUSERVE</title>
    <link rel="icon" type="image/png" href="logos/LOGO_PUSERVE.png">
    
    <!-- METADATA WA SHARE -->
    <meta property="og:title" content="PUSERVE Outlook"> 
    <meta id="og-desc" property="og:description" content="Latest Environmental News, Opinions, and Analysis.">
    <meta id="og-image" property="og:image" content="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    <meta property="og:type" content="article">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    
    <style>
        .ap-author-section { display: flex; align-items: center; gap: 15px; margin-top: 30px; margin-bottom: 30px; padding: 15px 0; border-top: 1px solid rgba(0,0,0,0.1); border-bottom: 1px solid rgba(0,0,0,0.1); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body.eco-mode .ap-author-section { border-color: rgba(255,255,255,0.1); }
        .ap-author-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--puserve-yellow); background: #eee; }
        .ap-author-info { display: flex; flex-direction: column; gap: 3px; }
        .ap-author-name { font-weight: 800; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-color); }
        .ap-author-name a { color: var(--text-color); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; transition: 0.2s ease; }
        .ap-author-name a:hover { color: var(--primary-green); }
        body.eco-mode .ap-author-name a:hover { color: var(--puserve-yellow); }
        .ap-author-time { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    </style>
</head>
<body>

    {% include navbar.html %}
    <div id="reading-progress"></div>

    <main class="read-container">
        <div class="paper">
            <a href="news.html" class="back-link trans-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> <span data-en="Back to Outlook" data-id="Kembali ke Kabar">Back to Outlook</span></a>
            <div id="pr-content"><h2 style="text-align:center; color:var(--text-muted);" data-en="Loading article..." data-id="Memuat artikel...">Loading article...</h2></div>
        </div>
    </main>

    {% include footer.html %}

    <script>
        function copyLink() { navigator.clipboard.writeText(window.location.href).then(() => { showToast(localStorage.getItem('puserve_lang') === 'EN' ? "Link copied!" : "Tautan disalin!"); }); }
        
        let currentFm = null;
        let currentBodyEN = "";
        let currentBodyID = "";
        let teamDataList = [];

        // Database Nama Singkat vs Nama Panjang (Target Scroll)
        const authorMappings = {
            "Muh. Ahsan I.S. Zulni": "Muh. Ahsan Ilham Safatullah Zulni",
            "Aurelia C.P. Kaparang": "Aurelia Cecillia Patricia Kaparang",
            "Beatrix K.P. Madeline": "Beatrix Kezhia Pasya Putri Madeline",
            "Muhammad H.F. Adzhim": "Muhammad Habib Fauzan Adzhim",
            "Noel Jacob Ottley": "Noel Jacob Ottley" // Pas-in kalau ada nama lu
        };

        function formatAPTime(dateStr, lang) {
            try { 
                const d = new Date(dateStr); 
                if(!isNaN(d)) {
                    const timeOpts = { hour: 'numeric', minute: '2-digit', hour12: true };
                    const dateOpts = { month: 'long', day: 'numeric', year: 'numeric' };
                    const timePart = d.toLocaleTimeString('en-US', timeOpts);
                    const datePart = d.toLocaleDateString(lang === 'EN' ? 'en-US' : 'id-ID', dateOpts);
                    const prefix = lang === 'EN' ? 'Updated' : 'Diperbarui';
                    return `${prefix} ${timePart} GMT+7, ${datePart}`;
                }
            } catch(e){}
            return dateStr;
        }

        function renderArticle() {
            if (!currentFm) return;
            const lang = localStorage.getItem('puserve_lang') || 'EN';
            
            const title = lang === 'EN' ? (currentFm.title_en || currentFm.title) : (currentFm.title_id || currentFm.title);
            const mdText = lang === 'EN' ? currentBodyEN : currentBodyID;
            const bodyHTML = marked.parse(mdText);
            
            const wordCount = bodyHTML.replace(/<[^>]*>?/gm, '').split(/\s+/).length;
            const readingTime = Math.max(1, Math.ceil(wordCount / 200));

            const apTimeStr = formatAPTime(currentFm.date, lang);

            const img1 = currentFm.thumbnail ? (currentFm.thumbnail.includes('/') ? currentFm.thumbnail : `uploads/${currentFm.thumbnail}`) : '';
            
            // META THUMBNAIL (Buat WA)
            const desc = lang === 'EN' ? (currentFm.desc_en || title) : (currentFm.desc_id || title);
            document.title = `${title} | PUSERVE Outlook`;
            document.getElementById('og-desc').setAttribute('content', desc);
            if (img1) {
                const fullImgUrl = `https://puserve.github.io/${img1.startsWith('/') ? img1.slice(1) : img1}`;
                document.getElementById('og-image').setAttribute('content', fullImgUrl);
            }

            // LOGIKA NAMA PENULIS & TARIK FOTO PROFIL
            let rawAuthor = currentFm.author || 'PUSERVE Editorial Board';
            let targetFullName = authorMappings[rawAuthor] || rawAuthor; // Nyari nama aslinya
            
            // Nyari foto di data CMS Team
            let authorImg = "logos/LOGO_PUSERVE.png";
            let teamMatch = teamDataList.find(t => t.name && t.name.toLowerCase() === targetFullName.toLowerCase());
            if (teamMatch && teamMatch.thumbnail) {
                authorImg = teamMatch.thumbnail.includes('/') ? teamMatch.thumbnail : `uploads/${teamMatch.thumbnail}`;
            }
            
            let authorBlock = '';
            if (rawAuthor === 'PUSERVE Editorial Board') {
                const authorText = lang === 'ID' ? 'DEWAN REDAKSI PUSERVE' : 'PUSERVE EDITORIAL BOARD';
                authorBlock = `<span class="ap-author-name">BY ${authorText}</span>`;
            } else {
                const byText = lang === 'ID' ? 'OLEH' : 'BY';
                const editorialText = lang === 'ID' ? 'DEWAN REDAKSI PUSERVE | ' : 'PUSERVE EDITORIAL BOARD | ';
                let safeNameUrl = encodeURIComponent(targetFullName); // Linknya nembak nama aslinya!
                authorBlock = `
                    <span class="ap-author-name">
                        ${byText} ${editorialText} <a href="team.html?scrollto=${safeNameUrl}">${rawAuthor.toUpperCase()}</a>
                    </span>
                `;
            }

            const apAuthorSection = `
                <div class="ap-author-section">
                    <img src="${authorImg}" alt="${rawAuthor}" class="ap-author-img">
                    <div class="ap-author-info">
                        ${authorBlock}
                        <span class="ap-author-time">${apTimeStr} &bull; ${readingTime} min read</span>
                    </div>
                </div>
            `;

            let html = `
                <div class="pr-header" style="margin-bottom: 20px;">
                    <div class="pr-tag" style="margin-bottom:15px;">${lang==='EN'?"PUSERVE OUTLOOK REPORT":"LAPORAN PUSERVE OUTLOOK"}</div>
                    <h1 class="pr-title" style="margin-bottom: 0;">${title}</h1>
                </div>
            `;

            if(img1) html += `<img src="${img1}" class="hero-img" alt="Thumbnail" onerror="this.style.display='none'">`;
            
            html += apAuthorSection;
            html += `<div class="pr-body">${bodyHTML}</div>`;
            
            const quoteText = lang === 'EN' ? (currentFm.quote_en || currentFm.quote) : (currentFm.quote_id || currentFm.quote);
            if (quoteText) { 
                html += `<div class="outcome-box" style="margin-top:40px;"><div class="outcome-title">KEY QUOTE</div><div class="outcome-text">"${quoteText}"</div></div>`; 
            }

            const shareText = lang === 'EN' ? 'Share this article:' : 'Bagikan artikel ini:';
            const shareUrl = encodeURIComponent(`${window.location.href.split('&lang=')[0]}&lang=${lang}`);
            html += `
                <div class="share-box">
                    <span class="share-title">${shareText}</span>
                    <div class="share-buttons">
                        <a href="https://wa.me/?text=${shareUrl}" target="_blank" class="share-btn wa-btn"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> WhatsApp</a>
                        <button onclick="copyLink()" class="share-btn copy-btn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Link</button>
                    </div>
                </div>
            `;
            document.getElementById('pr-content').innerHTML = html;
        }

        async function loadPressRelease() {
            const params = new URLSearchParams(window.location.search);
            const fileName = params.get('file');
            
            const forcedLang = params.get('lang');
            if(forcedLang) { localStorage.setItem('puserve_lang', forcedLang.toUpperCase()); }

            let currentLang = localStorage.getItem('puserve_lang') || 'EN';
            const contentDiv = document.getElementById('pr-content');
            if (!fileName) { contentDiv.innerHTML = `<h2 style='color:var(--puserve-yellow); text-align:center;'>${currentLang==='EN'?'Error: Document not found.':'Dokumen tidak ditemukan.'}</h2>`; return; }

            // TARIK DATA TIM DULU BIAR DAPET FOTONYA!
            try {
                const teamRes = await fetch('api/team.json');
                if(teamRes.ok) teamDataList = await teamRes.json();
            } catch(e) {}

            try {
                const response = await fetch(`https://raw.githubusercontent.com/puserve/puserve.github.io/main/_news/${fileName}`);
                if (!response.ok) throw new Error("Gagal");

                const mdText = await response.text();
                const parts = mdText.split('---');

                if (parts.length >= 3) {
                    currentFm = jsyaml.load(parts[1]);
                    const rawBody = parts.slice(2).join('---');
                    
                    const splitBody = rawBody.split(/^[\s*_]*===ID===[\s*_]*$/m);
                    currentBodyEN = splitBody[0] ? splitBody[0].trim() : "";
                    currentBodyID = splitBody[1] ? splitBody[1].trim() : currentBodyEN;
                    
                    renderArticle();
                    
                    window.addEventListener('scroll', () => {
                        let st = window.pageYOffset || document.documentElement.scrollTop;
                        let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                        document.getElementById("reading-progress").style.width = ((st / height) * 100) + "%";
                    });
                }
            } catch (error) { contentDiv.innerHTML = `<h2 style='color:var(--text-muted); text-align:center;'>${currentLang==='EN'?'Failed to load document.':'Gagal memuat dokumen.'}</h2>`; }
        }
        
        document.addEventListener("DOMContentLoaded", loadPressRelease);

        const langToggleCustom = document.getElementById('langToggle');
        if(langToggleCustom) {
            langToggleCustom.addEventListener('click', () => { setTimeout(() => { if(typeof renderArticle === "function") renderArticle(); }, 100); });
        }
    </script>
</body>
</html>
