<!-- PROFESSIONAL MODAL JOIN US (FORMSPREE) -->
<div id="join-modal" class="modal-overlay">
    <div class="modal-content-box" style="max-width: 500px; padding: 40px 30px; border-radius: 20px;">
        <span class="close-modal-btn" onclick="closeJoinModal()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </span>
        
        <h2 style="color: var(--dark-green); font-weight: 900; font-size: 2rem; margin-bottom: 10px; text-align: center;" data-en="Get Involved" data-id="Mari Bergabung">Get Involved</h2>
        <p style="color: var(--text-muted); text-align: center; margin-bottom: 30px; font-weight: 500;" data-en="Fill out the form below and our team will get back to you shortly." data-id="Isi formulir di bawah dan tim kami akan segera menghubungi Anda.">Fill out the form below and our team will get back to you shortly.</p>
        
        <!-- JANGAN LUPA GANTI ACTION URL DENGAN ENDPOINT FORMSPREE LU! -->
        <form id="puserve-contact-form" action="https://formspree.io/f/GANTI_PAKE_ID_LU" method="POST">
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display: block; margin-bottom: 8px; font-weight: 700; color: var(--text-color); font-size: 0.9rem;" data-en="Full Name" data-id="Nama Lengkap">Full Name</label>
                <input type="text" name="name" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 1rem; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display: block; margin-bottom: 8px; font-weight: 700; color: var(--text-color); font-size: 0.9rem;">Email Address</label>
                <input type="email" name="email" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 1rem; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display: block; margin-bottom: 8px; font-weight: 700; color: var(--text-color); font-size: 0.9rem;" data-en="Inquiry Type" data-id="Tujuan">Inquiry Type</label>
                <select name="inquiry_type" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 1rem; box-sizing: border-box; cursor: pointer;">
                    <option value="Volunteer">Volunteer / Eco-Warrior</option>
                    <option value="Partnership">Partnership / Sponsor</option>
                    <option value="Media/Press">Media / Press</option>
                    <option value="General Question">General Question</option>
                </select>
            </div>
            
            <div style="margin-bottom: 25px; text-align: left;">
                <label style="display: block; margin-bottom: 8px; font-weight: 700; color: var(--text-color); font-size: 0.9rem;" data-en="Message" data-id="Pesan">Message</label>
                <textarea name="message" rows="4" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 1rem; box-sizing: border-box; resize: vertical;"></textarea>
            </div>
            
            <button type="submit" id="submit-form-btn" style="width: 100%; padding: 15px; border: none; border-radius: 8px; background: var(--primary-green); color: white; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; font-family: inherit;" data-en="Send Message" data-id="Kirim Pesan">Send Message</button>
            <p id="form-status" style="text-align: center; margin-top: 15px; font-weight: 700; display: none;"></p>
        </form>
    </div>
</div>
