<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title_en | default: page.title }} | PUSERVE Events</title>
    
    <meta property="og:title" content="PUSERVE Events"> 
    <meta property="og:description" content="{{ page.desc_en | default: page.outcome_en | default: page.title_en }}">
    {% if page.thumbnail %}
    <meta property="og:image" content="https://puserve.github.io/{{ page.thumbnail | remove_first: '/' }}">
    {% else %}
    <meta property="og:image" content="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    {% endif %}
    <meta property="og:type" content="article">

    <link rel="icon" type="image/png" href="https://puserve.github.io/logos/LOGO_PUSERVE.png">
    <link rel="stylesheet" href="https://puserve.github.io/style.css">
</head>
<body>

    {% include navbar.html %}
    <div id="reading-progress"></div>

    <main class="read-container">
        <div class="paper">
            <a href="https://puserve.github.io/events.html" class="back-link trans-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> <span data-en="Back to Events" data-id="Kembali ke Acara">Back to Events</span></a>
            <div id="pr-content"></div>
        </div>
    </main>

    {% include footer.html %}

    <script>
        function copyLinkText(title, lang) { 
            const readMore = lang === 'EN' ? 'Read more at:' : 'Baca selengkapnya di:';
            const textToCopy = `*${title}*\n\n${readMore}\n${window.location.href}`;
            navigator.clipboard.writeText(textToCopy).then(() => { showToast(lang === 'EN' ? "Link copied!" : "Tautan disalin!"); }); 
        }

        async function renderStaticArticle() {
            const lang = localStorage.getItem('puserve_lang') || 'EN';
            
            const titleEN = {{ page.title_en | jsonify }} || {{ page.title | jsonify }};
            const titleID = {{ page.title_id | jsonify }} || titleEN;
            const title = lang === 'EN' ? titleEN : titleID;

            const rawHtml = {{ content | jsonify }};
            const splitBody = rawHtml.split(/<p>[\s*_]*===ID===[\s*_]*<\/p>|===ID===/);
            const bodyEN = splitBody[0] || "";
            const bodyHTML = lang === 'EN' ? bodyEN : (splitBody[1] || bodyEN);

            const wordCount = bodyHTML.replace(/<[^>]*>?/gm, '').split(/\s+/).length;
            const readingTime = Math.max(1, Math.ceil(wordCount / 200));
            
            let cleanDate = {{ page.date | jsonify }};
            try { const d = new Date(cleanDate.replace(/-/g, "/")); if(!isNaN(d)) cleanDate = d.toLocaleDateString(lang==='EN'?'en-US':'id-ID', {day:'numeric', month:'long', year:'numeric', hour: '2-digit', minute:'2-digit'}); } catch(e){}
            
            const rawThumbnail = {{ page.thumbnail | jsonify }};
            const img1 = rawThumbnail ? (rawThumbnail.includes('/') ? rawThumbnail : `uploads/${rawThumbnail}`) : '';

            let html = `<div class="pr-header"><div class="pr-tag">${lang==='EN'?"OFFICIAL EVENTS & PROGRAMS REPORT":"LAPORAN ACARA & PROGRAM RESMI"}</div><h1 class="pr-title">${title}</h1>
                <div class="pr-meta"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--puserve-yellow)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> Jakarta, ID</span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--puserve-yellow)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${cleanDate}</span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--puserve-yellow)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> ${{{ page.attendees | default: '-' | jsonify }}}</span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--puserve-yellow)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${readingTime} min read</span></div></div>`;

            if(img1) html += `<img src="https://puserve.github.io/${img1}" class="hero-img" alt="Thumbnail" onerror="this.style.display='none'">`;
            
            html += `<div class="pr-body">${bodyHTML}</div>`;

            const outcomeText = lang === 'EN' ? {{ page.outcome_en | jsonify }} : {{ page.outcome_id | jsonify }};
            if (outcomeText) { html += `<div class="outcome-box" style="margin-top:40px;"><div class="outcome-title">${lang==='EN' ? 'OUTCOME' : 'HASIL'}</div><div class="outcome-text">"${outcomeText}"</div></div>`; }

            const desc = lang === 'EN' ? ({{ page.desc_en | jsonify }} || title) : ({{ page.desc_id | jsonify }} || title);
            const waText = encodeURIComponent(`*${title}*\n${desc}\n\n${lang === 'EN' ? 'Read more at:' : 'Baca selengkapnya di:'}\n${window.location.href}`);
            
            html += `
                <div class="share-box">
                    <span class="share-title">${lang === 'EN' ? 'Share this article:' : 'Bagikan artikel ini:'}</span>
                    <div class="share-buttons">
                        <a href="https://wa.me/?text=${waText}" target="_blank" class="share-btn wa-btn"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> WhatsApp</a>
                        <button onclick="copyLinkText('${title.replace(/'/g, "\\'")}', '${lang}')" class="share-btn copy-btn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Link</button>
                    </div>
                </div>
            `;
            document.getElementById('pr-content').innerHTML = html;

            window.addEventListener('scroll', () => {
                let st = window.pageYOffset || document.documentElement.scrollTop;
                let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                document.getElementById("reading-progress").style.width = ((st / height) * 100) + "%";
            });
        }

        document.addEventListener("DOMContentLoaded", renderStaticArticle);
        const langToggleCustom = document.getElementById('langToggle');
        if(langToggleCustom) langToggleCustom.addEventListener('click', () => { setTimeout(() => { renderStaticArticle(); }, 100); });
    </script>
</body>
</html>
